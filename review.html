<script>
'use strict';
const SHEET_ID = "18nYehpbpOmARe9NI6EXdKKFiYG53C3OMgKm4A5CuLFk";
const MAIN_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const STAGE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=places_check`;
const WRITE_URL = "https://script.google.com/macros/s/AKfycbyxI4tO5BqzceSnml-mbChZitp5SzfcUyJfBpYdlWvf4TWTB3aKVigIWKoGbZL_BeDL/exec";

function getToken(){ try { return localStorage.getItem('rm_token') || ''; } catch(e){ return ''; } }
/* Schreib-URL wie in index.html: eine per Karte hinterlegte URL gewinnt (sonst laufen Karte und
   Review nach einem NEUEN Apps-Script-Deployment auf verschiedene Endpunkte). */
function getWriteUrl(){ try { return localStorage.getItem('rm_write_url') || WRITE_URL; } catch(e){ return WRITE_URL; } }
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('edit')) { try { localStorage.setItem('rm_token', urlParams.get('edit')); } catch(e){}
  history.replaceState(null,'',location.pathname); }

function toast(m, ms=2200){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }
/* Toast mit Rückgängig-Link (Sicherheitsnetz: Geprüfte sind sonst 12 Monate unsichtbar) */
function toastUndo(m, fn, ms=7000){ const t=document.getElementById('toast');
  t.innerHTML = esc(m) + '<span class="undo">Rückgängig</span>';
  t.querySelector('.undo').onclick = () => { t.style.display='none'; fn(); };
  t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }

let lastErr = '', lastErrDetail = '';
async function post(payload){ return !!(await postJson(payload)); }
/* Ein Versuch. Wirft mit .code: 'http:<status>' | 'parse' (Antwort war kein JSON, meist eine
   Google-Fehlerseite) | 'netz' (Anfrage kam gar nicht durch / CORS). */
async function postOnce(payload){
  let res;
  try { res = await fetch(getWriteUrl(), { method:'POST', body: JSON.stringify({ token:getToken(), ...payload }) }); }
  catch(e){ const err=new Error('netz'); err.code='netz'; err.detail=String(e.message||e); throw err; }
  const txt = await res.text();
  if (!res.ok){ const err=new Error('http'); err.code='http:'+res.status; err.detail=txt.slice(0,160); throw err; }
  try { return JSON.parse(txt); }
  catch(_){ const err=new Error('parse'); err.code='parse'; err.detail=txt.slice(0,160); throw err; }
}
/* Transiente Fehler (Apps Script antwortet gelegentlich mit einer Fehlerseite) einmal still
   wiederholen. Fachliche Fehler (ok:false, z. B. auth/schema) werden NICHT wiederholt. */
async function postJson(payload){
  for (let versuch=1; versuch<=2; versuch++){
    try {
      const j = await postOnce(payload);
      if (!j.ok){ lastErr = j.error||'?'; lastErrDetail=''; toast('Fehler: ' + lastErr); return null; }
      lastErr = ''; lastErrDetail=''; return j;
    } catch(e){
      lastErr = e.code || 'netz'; lastErrDetail = e.detail || '';
      console.warn('[restomap review] Schreibversuch '+versuch+' fehlgeschlagen:', lastErr, lastErrDetail);
      if (versuch===1){ await new Promise(r=>setTimeout(r, 900)); continue; }   // stiller Wiederholversuch
      toast('Nicht gespeichert (' + lastErr + ')');
      return null;
    }
  }
}
/* Ehrliche Speicherung: schreibt und meldet Erfolg zurück; bei Fehler bleibt der Dauer-Banner stehen. */
function saveErrShow(msg){ document.getElementById('saveErrTxt').innerHTML = msg;
  document.getElementById('saveErr').style.display='block'; }
function saveErrHide(){ document.getElementById('saveErr').style.display='none'; }
const ERR_AUTH = '<b>Nicht gespeichert — Edit-Zugang abgelaufen.</b> Öffne einmal deinen aktuellen Edit-Link '
  + '(<code>?edit=…</code>) auf diesem Gerät, dann tippe erneut. Bis dahin wird nichts gesichert.';
/* Klartext statt Fehlercode — sagt, was zu prüfen ist. */
function errText(code){
  if (code==='auth') return ERR_AUTH;
  if (code==='netz') return '<b>Nicht gespeichert — Server nicht erreichbar.</b> Die Anfrage kam nicht bei Google an '
    + '(auch nach einem automatischen zweiten Versuch). Häufigste Ursache ist nicht das Internet, sondern eine '
    + '<b>veraltete Schreib-URL</b>: Wenn das Apps Script als <i>neues</i> Deployment statt als neue Version '
    + 'veröffentlicht wurde, ändert sich die <code>/exec</code>-Adresse. Prüfen: Apps Script → Bereitstellen → '
    + 'Bereitstellungen verwalten → URL mit der in dieser Datei vergleichen.';
  if (code==='parse') return '<b>Nicht gespeichert — unerwartete Antwort von Google.</b> Statt JSON kam eine '
    + 'HTML-Seite zurück (typisch bei abgelaufener Bereitstellung, fehlendem Zugriff „Jeder“, oder einer '
    + 'Google-Störung). Prüfen: <code>/exec</code> im Browser öffnen — es sollte <code>version:7</code> zeigen.';
  if (String(code).startsWith('http:')) return '<b>Nicht gespeichert — Google antwortete mit '+esc(code)+'.</b> '
    + 'Bei 401/403 stimmt der Zugriff der Bereitstellung nicht („Ausführen als: Ich“, „Zugriff: Jeder“); '
    + 'bei 5xx ist es meist vorübergehend.';
  if (String(code).startsWith('schema')) return '<b>Nicht gespeichert — Schema-Fehler:</b> '+esc(code)
    + '. Läuft schon die neue <code>Code-v7.gs</code> (mit <code>geprueft_am</code>) als Bereitstellung?';
  return '<b>Nicht gespeichert</b> (Fehler: '+esc(code||'?')+'). Bitte erneut versuchen.';
}
async function commit(payload){
  const ok = !!(await postJson(payload));
  if (!ok){ saveErrShow(errText(lastErr) + (lastErrDetail ? '<br><small>Antwort: '+esc(lastErrDetail)+'</small>' : '')); }
  else { saveErrHide(); }
  return ok;
}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(cell!==''||row.length){ row.push(cell); rows.push(row); row=[]; cell=''; } }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift();
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}

let main = [], stage = [], byId = {}, stById = {};
/* Welle F: neue Werte (sehr_gut/gut/mittel) + Alt-Werte (top/gut_blau/Legacy-gut) — beide verstanden. */
const RL = { sehr_gut:'Sehr gut', gut:'Gut', mittel:'Mittel', unbewertet:'Ohne Urteil', nie_wieder:'Nie wieder',
             top:'Sehr gut', gut_blau:'Gut' };

/* ====== Datenqualitäts-Modus „Nach Typ": Konstanten (deckungsgleich mit der Karte) ====== */
const TYPES = ["Restaurant","Asia","Café","Kneipe","Cocktail-Bar","Imbiss","Pizza","Club/Livemusik",
               "Biergarten","Sushi","Eis","Weinbar","Burger","Steak/Grill","Fisch","Sportsbar","Karaoke",
               "Bäcker","Dessert"];
const TYP_SHORT = { "Cocktail-Bar":"Bar" };
const COLORS = { gold:"#F0A800", lila:"#9C27B0", gruen:"#0F9D58", blau:"#1976D2", orange:"#E65100", grau:"#8A8A8E", rot:"#7B1420", unbew:"#8A8A8E" };
const UNBEW_ALPHA = 0.55;   // Grau-Split: „ohne Urteil" gedimmt (deckungsgleich mit der Karte)
const RATE_ORDER = ['gold','lila','gruen','blau','grau','orange','rot','unbew'];
// Schreibt IMMER die neuen Werte (Zielmodell); Lesen versteht alte + neue (s. ratingKey/normQ).
const RATE2QP = { gold:['sehr_gut','normal'], lila:['sehr_gut','teuer'], gruen:['sehr_gut','guenstig'], blau:['gut','normal'],
                  orange:['unbewertet','ueberteuert'], rot:['nie_wieder','normal'], grau:['mittel','normal'], unbew:['unbewertet','normal'] };
const RATE_LBL = { gold:"Sehr gut", lila:"Sehr gut·teuer", gruen:"Sehr gut & günstig", blau:"Gut", orange:"Zu teuer", grau:"Mittel", unbew:"Ohne Urteil", rot:"Nie wieder" };
let LEGACY_GUT = false;   // Alt-Werte im Datensatz? (wird nach dem Laden gesetzt; wie in index.html)
function normQ(q,p){ if(q==="top")return "sehr_gut"; if(q==="gut_blau")return "gut";
  if(q==="gut"&&LEGACY_GUT)return p==="guenstig"?"sehr_gut":"gut"; return q; }
function ratingKey(q,p){ q=normQ(q,p);
  if(p==="ueberteuert")return "orange"; if(q==="nie_wieder")return "rot";
  if(q==="sehr_gut")return p==="teuer"?"lila":(p==="guenstig"?"gruen":"gold");
  if(q==="gut")return p==="teuer"?"orange":"blau";
  if(q==="mittel")return p==="teuer"?"orange":"grau"; return "unbew"; }
/* Asia-Split (Welle F): kueche-Werteliste für den Review (Martins Freigabe 27.07.2026) */
const KUECHEN_ASIA = ['vietnamesisch','thai','chinesisch','koreanisch','japanisch','indisch','sonstige-asiatisch'];
const ANLASS_KEYS = ['fruehstueck','brunch','lunch','kaffee','dinner','drinks','music'];
const PRICES = [['guenstig','€'],['normal','€€'],['teuer','€€€'],['ueberteuert','€€€!']];
let typFilter = '', typSearch = '', rateFilter = '', statusFilter = '';   // Filter im Modus „Nach Typ"
const STATUS_OPT = [['','Beide'],['besucht','Besucht'],['wunschliste','Watchlist']];

/* ====== „Geprüft"-Haken (nur Modus „Nach Typ"; andere Stapel bleiben unberührt) ====== */
const GEPRUEFT_MONATE = 12;
function heute(){ return new Date().toLocaleDateString('sv-SE'); }   // YYYY-MM-DD, lokale Zeit
/** true = in den letzten 12 Monaten geprüft (→ ausgeblendet). Unlesbare/leere Daten = nicht geprüft. */
function istGeprueft(r){
  const d = (r.geprueft_am||'').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const grenze = new Date(); grenze.setMonth(grenze.getMonth() - GEPRUEFT_MONATE);
  return new Date(d+'T00:00:00') > grenze;
}

function gmaps(r){ return `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}`; }
function meta(r){ return `${r.typ} · ${r.status==='besucht'?'Besucht':'Watchlist'} · ${RL[r.qualitaet]||r.qualitaet}${r.preis==='ueberteuert'?' · zu teuer':''}${r.notiz?' · '+r.notiz:''}`; }

/* ====== Stapel-Definitionen ====== */
const HANDLED = new Set();   // ids, die in dieser Sitzung erledigt/übersprungen wurden

function qClosed(){ return stage.filter(s => byId[s.id] && !HANDLED.has('c'+s.id)
  && ['CLOSED_PERMANENTLY','NICHT GEFUNDEN',''].includes(s.business_status)
  && !['ok','archiviert','nein'].includes((s.uebernehmen||'').toLowerCase())); }
function qTemp(){ return stage.filter(s => byId[s.id] && !HANDLED.has('t'+s.id)
  && s.business_status==='CLOSED_TEMPORARILY'
  && !['ok','archiviert','nein'].includes((s.uebernehmen||'').toLowerCase())); }
function qMatch(){ return stage.filter(s => byId[s.id] && !HANDLED.has('m'+s.id)
  && s.business_status==='OPERATIONAL' && (s.uebernehmen||'').toLowerCase()==='pruefen'); }
function qDupes(){
  const groups = {};
  main.forEach(r => { const k=r.name.toLowerCase().trim(); (groups[k]=groups[k]||[]).push(r); });
  return Object.values(groups).filter(g => g.length>1
    && !g.every(r => (r.dupe_flag||'')==='filiale')
    && !g.some(r => HANDLED.has('d'+r.id)));
}
function qGrau(){ return main.filter(r => r.qualitaet==='unbewertet' && r.preis!=='ueberteuert'
  && r.status==='besucht' && !HANDLED.has('g'+r.id)); }

/* Filter-Kaskade „Nach Typ": Status → Typ → Farbe → Suche.
   Jede Ebene zählt auf Basis der Ebenen darüber; „geprüft" ist überall ausgeblendet. */
function qTypStatusAll(){ return statusFilter ? main.filter(r => (r.status||'') === statusFilter) : main.slice(); }
function qTypOffen(){ return qTypStatusAll().filter(r => !istGeprueft(r)); }
function qTypByType(){ const a=qTypOffen(); return typFilter ? a.filter(r => (r.typ||'') === typFilter) : a; }
function qTyp(){
  let a = qTypByType();
  if (rateFilter) a = a.filter(r => ratingKey(r.qualitaet, r.preis) === rateFilter);
  if (typSearch){ const q = typSearch.toLowerCase(); a = a.filter(r => (r.name||'').toLowerCase().includes(q)); }
  a.sort((x,y)=> (x.typ||'').localeCompare(y.typ||'') || (x.name||'').localeCompare(y.name||''));
  return a;
}
const STACKS = [
  { key:'closed', name:'Geschlossen?', q:qClosed, render:renderStaging },
  { key:'temp',  name:'Temporär zu', q:qTemp, render:renderStaging },
  { key:'match', name:'Match prüfen', q:qMatch, render:renderMatch },
  { key:'dupes', name:'Duplikate', q:qDupes, render:renderDupes },
  { key:'grau',  name:'Graue', q:qGrau, render:renderGrau },
  { key:'typ',   name:'Nach Typ', q:qTyp, render:renderTypEdit },
];
let active = 'closed', shown = PAGE;

/* ====== Aktionen ====== */
/* „Gibt's nicht mehr" im Modus „Nach Typ" — für Läden, die Google noch als offen führt.
   Zwei Schritte, weil der Knopf direkt neben dem oft getippten Haken sitzt und Archivieren
   destruktiv ist (Zeile wandert ins archiv-Tab; Rückholen nur von Hand im Sheet).
   Nach 4 Sekunden ohne zweiten Tap entschärft er sich von selbst. */
function actArchivTyp(id, btn){
  if (btn.dataset.armed !== '1'){
    btn.dataset.scharf = btn.textContent;
    btn.dataset.armed = '1'; btn.textContent = '⚠︎ Wirklich? Nochmal tippen';
    btn.classList.add('armed');
    clearTimeout(btn._t);
    btn._t = setTimeout(()=>{ btn.dataset.armed='0'; btn.textContent = btn.dataset.scharf;
      btn.classList.remove('armed'); }, 4000);
    return;
  }
  clearTimeout(btn._t); btn.dataset.armed='0';
  actArchive(id, 'y');   // eigene HANDLED-Marke; wartet auf Server-Bestätigung (destruktiv)
}
async function actArchive(id, mark){
  const r = byId[id];
  if (!(await commit({ action:'archive', id }))) return;   // Fehler → Eintrag bleibt stehen
  post({ action:'stageUpdate', id, value:'archiviert' });
  HANDLED.add(mark+id); main = main.filter(x=>x.id!==id); delete byId[id];
  draw(); toast(`${r.name}: archiviert ✓`);
}
async function actKeep(id, mark){
  if (!(await commit({ action:'stageUpdate', id, value:'ok' }))) return;
  HANDLED.add(mark+id); draw(); toast('Bleibt — Fehlalarm vermerkt');
}
async function actMatch(id, good){
  if (!(await commit({ action:'stageUpdate', id, value: good?'ja':'nein' }))) return;
  HANDLED.add('m'+id); draw(); toast(good ? 'Match bestätigt' : 'Match verworfen');
}
/* Graue-Stapel: ebenfalls sofort reagieren (Bewertung ist nicht destruktiv, Rücknahme bei Fehler). */
async function actJudge(id, q){
  const r = byId[id];
  let updates, msg;
  if (q==='teuer'){ updates={ preis:'ueberteuert' }; msg=`${r.name}: zu teuer (P/L)`; }
  else if (q==='lila'){ updates={ qualitaet:'sehr_gut', preis:'teuer' }; msg=`${r.name}: Sehr gut · teuer`; }
  else { updates={ qualitaet:q }; msg=`${r.name}: ${RL[q]}`; }
  const seq = ++seqNr; PENDING.set(id, seq);
  const vorher = {}; Object.keys(updates).forEach(k => vorher[k] = r[k]);
  Object.assign(r, updates); HANDLED.add('g'+id); draw(); toast(msg);
  const ok = await commit({ id, updates });
  if (PENDING.get(id) === seq){
    PENDING.delete(id);
    if (!ok){ Object.assign(r, vorher); HANDLED.delete('g'+id); draw(); toast('Zurückgenommen — nicht gespeichert'); }
  }
}
async function actMergePair(keepId, archId){
  if (!(await commit({ action:'archive', id: archId }))) return;
  post({ id: keepId, updates:{ dupe_flag:'' } });
  HANDLED.add('d'+keepId); HANDLED.add('d'+archId);
  main = main.filter(x=>x.id!==archId); delete byId[archId];
  draw(); toast('Zusammengeführt ✓');
}
async function actFiliale(group){
  const oks = await Promise.all(group.map(r=>commit({ id:r.id, updates:{ dupe_flag:'filiale' } })));
  if (oks.some(x=>!x)) return;   // mind. ein Schreibvorgang fehlgeschlagen → nichts als erledigt markieren
  group.forEach(r=>HANDLED.add('d'+r.id)); draw(); toast('Als Filialen markiert');
}
function actSkip(id, mark){ HANDLED.add(mark+id); draw(); }
async function actRematch(id){
  const r = byId[id], s = stById[id];
  const q = prompt('Wonach soll Google suchen? (z.B. offizieller Name + Straße)', r.name);
  if (!q) return;
  toast('Suche läuft …', 8000);
  const j = await postJson({ action:'rematch', id, query: q });
  if (!j) return;
  if (!j.match) { toast('Skript kennt „rematch" nicht — ist Code v3 als NEUE VERSION deployt?', 5000); return; }
  s.name_google = j.match.name; s.adresse_google = j.match.addr;
  s.business_status = j.match.status; s.distanz_m = String(j.match.dist);
  s.place_id = j.match.place_id; s.uebernehmen = j.match.dist <= 150 ? 'ja' : 'pruefen';
  draw(); toast(`Neuer Treffer: ${j.match.name} (${j.match.dist} m)`);
}

/* ====== Renderer ====== */
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderStaging(s, mark){
  const r = byId[s.id];
  const bs = s.business_status || 'kein Status von Google';
  const far = +s.distanz_m > 30 || (s.name_google && s.name_google.toLowerCase().slice(0,4) !== r.name.toLowerCase().slice(0,4));
  return card(r, `
    <div class="c-google"><b>GOOGLE:</b> ${esc(s.name_google||'—')} · ${esc(s.adresse_google||'')}<br>
    <span class="${bs==='CLOSED_PERMANENTLY'?'warn':''}">${esc(bs)}</span> · Distanz ${esc(s.distanz_m||'?')} m
    ${far?' · <span class="warn">Match unsicher!</span>':''}</div>`, `
    <button class="b-arch" onclick="actArchive('${s.id}','${mark}')">🗑 Ist zu → Archiv</button>
    <button class="b-ok" onclick="actKeep('${s.id}','${mark}')">Bleibt (Fehlalarm)</button>
    <button class="b-merge" onclick="actRematch('${s.id}')">🔍 Neu suchen</button>
    <button class="b-skip" onclick="actSkip('${s.id}','${mark}')">Später</button>`);
}
function renderMatch(s){
  const r = byId[s.id];
  return card(r, `
    <div class="c-google"><b>GOOGLE MEINT:</b> ${esc(s.name_google||'—')}<br>${esc(s.adresse_google||'')} · Distanz ${esc(s.distanz_m)} m</div>`, `
    <button class="b-ok" onclick="actMatch('${s.id}',true)">✓ Match stimmt</button>
    <button class="b-skip" onclick="actMatch('${s.id}',false)">✗ Falscher Laden</button>
    <button class="b-merge" onclick="actRematch('${s.id}')">🔍 Neu suchen</button>
    <button class="b-arch" onclick="actArchive('${s.id}','m')">🗑 Gibt's nicht mehr</button>
    <button class="b-skip" onclick="actSkip('${s.id}','m')">Später</button>`);
}
function renderDupes(group){
  const rows = group.map(r=>`<div style="margin-top:6px"><span class="c-name" style="font-size:14px">${esc(r.name)}</span>
    <div class="c-meta">${meta(r)} · <a class="glink" style="margin:0" href="${gmaps(r)}" target="_blank">Maps ↗</a></div></div>`).join('');
  const pair = group.length===2 && group[0].status!==group[1].status;
  let btns = '';
  if (pair){
    const b = group.find(r=>r.status==='besucht'), w = group.find(r=>r.status==='wunschliste');
    btns = `<button class="b-merge" onclick="actMergePair('${b.id}','${w.id}')">Zusammenführen (Besucht behalten)</button>
            <button class="b-merge" onclick="actMergePair('${w.id}','${b.id}')">Watchlist behalten</button>`;
  } else {
    btns = group.map(r=>`<button class="b-arch" onclick="actArchive('${r.id}','d')">🗑 ${esc(r.name.slice(0,14))}… weg</button>`).join('');
  }
  return `<div class="card"><div class="c-meta"><b>${group.length}× gleicher Name</b></div>${rows}
    <div class="btns">${btns}
    <button class="b-ok" onclick='actFiliale(${JSON.stringify(group.map(r=>({id:r.id})))})'>Beide behalten (Filialen)</button>
    <button class="b-skip" onclick="actSkip('${group[0].id}','d')">Später</button></div></div>`;
}
function renderGrau(r){
  // Welle F: schreibt neue Werte (sehr_gut/gut/mittel); „Gut" = Blau-Kategorie.
  return card(r, '', `
    <button class="b-top" onclick="actJudge('${r.id}','sehr_gut')">Sehr gut</button>
    <button class="b-lila" onclick="actJudge('${r.id}','lila')">Sehr gut · teuer</button>
    <button class="b-blau" onclick="actJudge('${r.id}','gut')">Gut</button>
    <button class="b-grau" onclick="actJudge('${r.id}','mittel')">Mittel</button>
    <button class="b-teuer" onclick="actJudge('${r.id}','teuer')">Zu teuer</button>
    <button class="b-nie" onclick="actJudge('${r.id}','nie_wieder')">Nie wieder</button>
    <button class="b-skip" onclick="actSkip('${r.id}','g')">Bleibt grau</button>
    <button class="b-arch" onclick="actArchive('${r.id}','g')">🗑 Gibt's nicht mehr</button>`);
}
function card(r, extra, btns){
  return `<div class="card"><div class="c-name">${esc(r.name)}</div>
    <div class="c-meta">${meta(r)}</div>${extra}
    <a class="glink" href="${gmaps(r)}" target="_blank" rel="noopener">In Google Maps öffnen ↗</a>
    <div class="btns">${btns}</div></div>`;
}

/* ====== Datenqualitäts-Modus „Nach Typ": Editieren ====== */
/* ====== Sofort-Reaktion mit Rücknahme (schnell UND sicher) ======
   Die UI aktualisiert SOFORT und speichert im Hintergrund. Scheitert der Schreibvorgang
   (nach dem automatischen zweiten Versuch), wird die Änderung zurückgenommen und der rote
   Banner erklärt warum — also nie ein stiller Verlust, aber auch kein Warten auf Google.
   PENDING verhindert, dass eine späte Fehlermeldung eine NEUERE Eingabe überschreibt. */
const PENDING = new Map(); let seqNr = 0;

/* --- Schlanke Aktualisierung: nur die betroffene Karte + die Zahlen, statt der ganzen Liste.
   (Voller Neuaufbau kostet bei 20–60 Karten ~900–2.800 Buttons; das ist auf dem Handy spürbar.) --- */
function refreshCard(r){
  const el = document.querySelector('.card[data-id="'+r.id+'"]');
  if (!el) { drawList(); return; }
  const tmp = document.createElement('div'); tmp.innerHTML = renderTypEdit(r);
  el.replaceWith(tmp.firstElementChild);
}
/** Nur die Zähler/Fortschritt neu schreiben — Chips und Suchfeld bleiben unangetastet (kein Fokusverlust). */
function updateCounts(){
  const tb = document.getElementById('typbar');
  if (!tb || active!=='typ' || !tb.querySelector('[data-tc]')) return;
  const offen = qTypOffen(), imStatus = qTypStatusAll();
  const setN = (sel, n) => { const b = tb.querySelector(sel+' b'); if (b) b.textContent = n; };
  STATUS_OPT.forEach(([v]) => setN('[data-sc="'+v+'"]',
    main.filter(r => (!v || (r.status||'')===v) && !istGeprueft(r)).length));
  const tCounts={}; offen.forEach(r=>{ const t=r.typ||'—'; tCounts[t]=(tCounts[t]||0)+1; });
  setN('[data-tc=""]', offen.length);
  TYPES.forEach(t => setN('[data-tc="'+t.replace(/"/g,'&quot;')+'"]', tCounts[t]||0));
  const base = qTypByType(), rCounts={};
  base.forEach(r=>{ const k=ratingKey(r.qualitaet,r.preis); rCounts[k]=(rCounts[k]||0)+1; });
  setN('[data-rc=""]', base.length);
  RATE_ORDER.forEach(ck => setN('[data-rc="'+ck+'"]', rCounts[ck]||0));
  const f = tb.querySelector('.fortschritt');
  if (f){ const sLbl = statusFilter ? (STATUS_OPT.find(o=>o[0]===statusFilter)[1]+': ') : '';
    f.innerHTML = `${sLbl}${imStatus.length-offen.length} von ${imStatus.length} geprüft · <b>${offen.length} offen</b>`; }
}
/** Bleibt der Ort nach der Änderung überhaupt in der aktuellen Auswahl? */
function passtInAuswahl(r){
  if (istGeprueft(r)) return false;
  if (statusFilter && (r.status||'') !== statusFilter) return false;
  if (typFilter && (r.typ||'') !== typFilter) return false;
  if (rateFilter && ratingKey(r.qualitaet, r.preis) !== rateFilter) return false;
  return true;
}
/** Karte fällt aus der Auswahl → nur sie entfernen; sonst nur sie neu zeichnen. Kein Voll-Rebuild. */
function refreshTyp(r){
  if (active!=='typ' || !r){ if (active==='typ') renderTypbar(); drawList(); return; }
  if (passtInAuswahl(r)) refreshCard(r);
  else { const el=document.querySelector('.card[data-id="'+r.id+'"]'); if (el) el.remove(); else drawList(); }
  updateCounts();
}
async function optimistisch(r, updates, msg){
  const seq = ++seqNr; PENDING.set(r.id, seq);
  const vorher = {}; Object.keys(updates).forEach(k => vorher[k] = r[k]);
  Object.assign(r, updates); refreshTyp(r); if (msg) toast(msg);
  const ok = await commit({ id:r.id, updates });
  if (PENDING.get(r.id) === seq){                 // nur reagieren, wenn kein neuerer Tap kam
    PENDING.delete(r.id);
    if (!ok){ Object.assign(r, vorher); refreshTyp(r); toast('Zurückgenommen — nicht gespeichert'); }
  }
  return ok;
}
async function _save(r, updates){ return optimistisch(r, updates); }
/* „Geprüft"-Haken: setzt geprueft_am=heute → Ort verschwindet für 12 Monate aus „Nach Typ".
   Wirkt NUR hier; Geschlossen/Temporär/Match/Duplikate/Graue zeigen den Ort weiterhin. */
async function actGeprueft(id){
  const r = byId[id]; if(!r) return;
  const vorher = r.geprueft_am || '';
  const seq = ++seqNr; PENDING.set(id, seq);
  r.geprueft_am = heute(); refreshTyp(r);           // Karte verschwindet SOFORT
  toastUndo(`${r.name}: geprüft ✓`, async () => {
    await optimistisch(r, { geprueft_am: vorher }, 'Zurückgenommen');
  });
  const ok = await commit({ id, updates:{ geprueft_am: heute() } });
  if (PENDING.get(id) === seq){
    PENDING.delete(id);
    if (!ok){ r.geprueft_am = vorher; drawList(); updateCounts(); toast('Zurückgenommen — nicht gespeichert'); }
  }
}
function setTyp(id, t){ const r=byId[id]; if(!r || r.typ===t) return; _save(r,{ typ:t }); toast('Typ: '+t); }
function setKueche(id, k){ const r=byId[id]; if(!r) return;
  const v = (r.kueche===k) ? '' : k;             // erneuter Tap löscht (zurück auf „offen")
  _save(r,{ kueche:v }); toast(v ? 'Küche: '+v : 'Küche gelöscht'); }
function setRate(id, ck){ const r=byId[id]; if(!r) return; const qp=RATE2QP[ck]; _save(r,{ qualitaet:qp[0], preis:qp[1] }); toast(RATE_LBL[ck]+' ✓'); }
function setPreis(id, p){ const r=byId[id]; if(!r || r.preis===p) return; _save(r,{ preis:p }); toast('Preis ✓'); }
function toggleAnlass(id, tag){ const r=byId[id]; if(!r) return;
  let tags=(r.tags||'').split(',').map(x=>x.trim()).filter(Boolean);
  tags = tags.includes(tag) ? tags.filter(x=>x!==tag) : tags.concat(tag);
  _save(r,{ tags: tags.join(', ') }); }

function renderTypEdit(r){
  const tags=(r.tags||'').toLowerCase();
  const rk=ratingKey(r.qualitaet, r.preis);
  const typChips = TYPES.map(t=>`<button class="chip-sm${r.typ===t?' on':''}" onclick="setTyp('${r.id}','${t}')">${esc(TYP_SHORT[t]||t)}</button>`).join('');
  const rateDots = RATE_ORDER.map(ck=>`<button class="dot${rk===ck?' on':''}" style="background:${COLORS[ck]}${ck==='unbew'?`;opacity:${UNBEW_ALPHA}`:''}" title="${RATE_LBL[ck]}" onclick="setRate('${r.id}','${ck}')"></button>`).join('');
  const priceChips = PRICES.map(pl=>`<button class="chip-sm${r.preis===pl[0]?' on':''}" onclick="setPreis('${r.id}','${pl[0]}')">${pl[1]}</button>`).join('');
  const anlassChips = ANLASS_KEYS.map(a=>`<button class="chip-sm${tags.includes(a)?' on':''}" onclick="toggleAnlass('${r.id}','${a}')">${a}</button>`).join('');
  // Asia-Split (Welle F): kueche-Chips nur bei Typ Asia (kein stadtweiter Backfill — 19 Typen eingefroren)
  const kuecheBlock = r.typ==='Asia'
    ? `<div class="te-lbl">Küche</div><div class="te-row">${
        KUECHEN_ASIA.map(k=>`<button class="chip-sm${r.kueche===k?' on':''}" onclick="setKueche('${r.id}','${k}')">${k}</button>`).join('')
      }${r.kueche && !KUECHEN_ASIA.includes(r.kueche) ? `<button class="chip-sm on" onclick="setKueche('${r.id}','${esc(r.kueche)}')">${esc(r.kueche)}</button>` : ''}</div>`
    : '';
  return `<div class="card" data-id="${r.id}">
    <div class="c-name"><span class="sw" style="background:${COLORS[rk]||'#ccc'}${rk==='unbew'?`;opacity:${UNBEW_ALPHA}`:''}"></span>${esc(r.name)}</div>
    <div class="c-meta">${esc(r.typ||'—')} · ${r.status==='besucht'?'Besucht':'Watchlist'} · ${RL[r.qualitaet]||r.qualitaet||'—'}${r.typ==='Asia'&&r.kueche?' · '+esc(r.kueche):''} · <a class="glink" style="margin:0" href="${gmaps(r)}" target="_blank" rel="noopener">Maps ↗</a></div>
    <div class="te-lbl">Typ</div><div class="te-row">${typChips}</div>
    <div class="te-lbl">Bewertung</div><div class="te-row">${rateDots}</div>
    <div class="te-lbl">Preis</div><div class="te-row">${priceChips}</div>
    <div class="te-lbl">Anlass</div><div class="te-row">${anlassChips}</div>
    ${kuecheBlock}
    <div class="btns">
      <button class="b-done" onclick="actGeprueft('${r.id}')">✓ Geprüft — für 12 Monate erledigt</button>
      <button class="b-arch b-arch2" onclick="actArchivTyp('${r.id}', this)">🗑 Gibt's nicht mehr</button>
    </div>
  </div>`;
}
function renderTypbar(){
  const tb=document.getElementById('typbar');
  if (active!=='typ'){ tb.style.display='none'; return; }
  tb.style.display='block';
  // Status-Zeile (Besucht/Watchlist getrennt durchgehen); Zähler = noch offene Orte je Status
  const sChips = STATUS_OPT.map(([v,lbl])=>{
    const n = main.filter(r => (!v || (r.status||'')===v) && !istGeprueft(r)).length;
    return `<button class="tchip${statusFilter===v?' on':''}" data-sc="${v}" onclick="pickStatus('${v}')">${lbl} <b>${n}</b></button>`;
  }).join('');
  // Zähler zeigen nur OFFENE (nicht geprüfte) Orte — die Liste schrumpft beim Durcharbeiten
  const offen = qTypOffen();
  const counts={}; offen.forEach(r=>{ const t=r.typ||'—'; counts[t]=(counts[t]||0)+1; });
  const chips = [''].concat(TYPES).map(t=>{
    const lbl = t===''?'Alle':(TYP_SHORT[t]||t);
    const n = t===''?offen.length:(counts[t]||0);
    return `<button class="tchip${typFilter===t?' on':''}" data-tc="${esc(t)}" onclick="pickTyp('${t}')">${esc(lbl)} <b>${n}</b></button>`;
  }).join('');
  // Fortschritt im Rahmen der Status-Auswahl (Besucht und Watchlist getrennt zählbar)
  const imStatus = qTypStatusAll();
  const fertig = imStatus.length - offen.length;
  const sLbl = statusFilter ? (STATUS_OPT.find(o=>o[0]===statusFilter)[1]+': ') : '';
  const fortschritt = `<div class="fortschritt">${sLbl}${fertig} von ${imStatus.length} geprüft · <b>${offen.length} offen</b></div>`;
  // Farb-Bewertungs-Filter: Zähler beziehen sich auf die aktuelle Typ-Auswahl
  const base = qTypByType();
  const rCounts={}; base.forEach(r=>{ const k=ratingKey(r.qualitaet,r.preis); rCounts[k]=(rCounts[k]||0)+1; });
  const rChips = [''].concat(RATE_ORDER).map(ck=>{
    if (ck==='') return `<button class="tchip${rateFilter===''?' on':''}" data-rc="" onclick="pickRate('')">Alle Farben <b>${base.length}</b></button>`;
    const dim = ck==='unbew' ? `;opacity:${UNBEW_ALPHA}` : '';
    return `<button class="tchip${rateFilter===ck?' on':''}" data-rc="${ck}" onclick="pickRate('${ck}')">`
         + `<span class="sw" style="background:${COLORS[ck]}${dim}"></span>${esc(RATE_LBL[ck])} <b>${rCounts[ck]||0}</b></button>`;
  }).join('');
  tb.innerHTML = fortschritt + `<div class="tchips status">${sChips}</div>`
    + `<div class="tchips">${chips}</div><div class="tchips rate">${rChips}</div>`
    + `<input id="tsearch" placeholder="Name suchen …" value="${esc(typSearch)}" oninput="typSearch=this.value; drawList();">`;
}
function pickTyp(t){ typFilter=t; shown=PAGE; renderTypbar(); drawList(); window.scrollTo(0,0); }
function pickRate(ck){ rateFilter=ck; shown=PAGE; renderTypbar(); drawList(); window.scrollTo(0,0); }
function pickStatus(v){ statusFilter=v; shown=PAGE; renderTypbar(); drawList(); window.scrollTo(0,0); }

/* ====== Draw ====== */
function drawList(){
  const st = STACKS.find(s=>s.key===active);
  const items = st.q();
  const list = document.getElementById('list');
  if (!items.length){ list.innerHTML = active==='typ'
      ? '<div class="done">Keine Orte in dieser Auswahl.</div>'
      : '<div class="done">🎉 Stapel leer — nächsten wählen.</div>'; }
  else {
    const mark = { closed:'c', temp:'t' }[active] || '';
    list.innerHTML = items.slice(0, shown).map(it => st.render(it, mark)).join('');
  }
  document.getElementById('more').style.display = items.length > shown ? 'block' : 'none';
  document.getElementById('subtitle').textContent =
    `${qClosed().length + qTemp().length + qMatch().length} Orts-Checks · ${qDupes().length} Namens-Gruppen · ${qGrau().length} Graue`;
}
function draw(){
  const bar = document.getElementById('stacks');
  bar.innerHTML = STACKS.map(s=>`<button class="stack${s.key===active?' on':''}" onclick="setStack('${s.key}')">${s.name} <b>${s.q().length}</b></button>`).join('');
  renderTypbar();
  drawList();
}
function setStack(k){ active=k; shown=PAGE; draw(); window.scrollTo(0,0); }
document.getElementById('more').onclick = ()=>{ shown += PAGE; draw(); };

/* ====== Init ====== */
/* Schema-Guard, Lese-Seite (Welle F): warnen statt still falsch anzeigen (wie index.html). */
function schemaWarn(recs){
  if (!recs.length) return;
  const REQ = ['id','name','lat','lon','typ','status','qualitaet','preis','tags','kueche'];
  const have = Object.keys(recs[0]);
  const missing = REQ.filter(c=>!have.includes(c));
  const VQ=['sehr_gut','gut','mittel','unbewertet','nie_wieder','top','gut_blau',''];
  const bad={};
  recs.forEach(r=>{ const q=String(r.qualitaet??'').trim();
    if(!VQ.includes(q)) bad[q]=(bad[q]||0)+1; });
  const msgs=[];
  if (missing.length) msgs.push('Spalte(n) fehlen/umbenannt: '+missing.join(', '));
  if (Object.keys(bad).length) msgs.push('unbekannte qualitaet-Werte: '+Object.keys(bad).join(', '));
  if (msgs.length){
    console.warn('[restomap review] Schema-Drift:', missing, bad);
    document.getElementById('subtitle').textContent = '⚠ Schema-Problem im Sheet — '+msgs.join(' · ');
  }
}
(async function init(){
  if (!getToken()){ document.getElementById('gate').style.display='block'; return; }
  document.getElementById('hdr').style.display='block';
  document.getElementById('stacks').style.display='flex';
  try {
    const [m, s] = await Promise.all([
      fetch(MAIN_URL).then(r=>r.text()), fetch(STAGE_URL).then(r=>r.text()) ]);
    main = parseCSV(m).filter(r=>r.id);
    stage = parseCSV(s).filter(r=>r.id);
    LEGACY_GUT = main.some(r=>r.qualitaet==='top'||r.qualitaet==='gut_blau');   // Welle F (wie Karte)
    schemaWarn(main);   // Schema-Guard, Lese-Seite (Welle F)
    main.forEach(r=>byId[r.id]=r);
    stage.forEach(s=>stById[s.id]=s);
    draw();
    checkAuth();   // Startpruefung: warnt SOFORT, wenn der Edit-Token ungueltig ist (bevor du editierst)
  } catch(e){
    document.getElementById('subtitle').textContent = 'Daten konnten nicht geladen werden: ' + e.message;
  }
})();
/* Nur bei echtem Auth-Fehler warnen; ein Netz-Wackler oder ein Alt-Skript ohne "ping" loest KEINEN Banner aus. */
async function checkAuth(){
  try {
    const res = await fetch(getWriteUrl(), { method:'POST', body: JSON.stringify({ token:getToken(), action:'ping' }) });
    const j = await res.json();
    if (j && j.error==='auth') saveErrShow(ERR_AUTH);   // nur der eindeutige Token-Fehler
  } catch(e){ /* Netzfehler beim Laden ignorieren */ }
}
