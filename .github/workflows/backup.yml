name: nightly-backup

on:
  schedule:
    - cron: '23 3 * * *'   # täglich 03:23 UTC
  workflow_dispatch: {}      # manueller Start über den Actions-Tab (für den ersten Test)

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sheet abrufen, private Felder strippen, GeoJSON bauen
        run: |
          # Voller Abruf nur in eine TEMPORÄRE Datei — sie wird NICHT committet.
          curl -sL "https://docs.google.com/spreadsheets/d/18nYehpbpOmARe9NI6EXdKKFiYG53C3OMgKm4A5CuLFk/gviz/tq?tqx=out:csv" -o /tmp/sheet-full.csv
          python3 - << 'EOF'
          import csv, json

          PRIVATE = {'notiz', 'besucht_am'}   # Paket 0 (2026-07-25): nie ins öffentliche Repo

          rows = list(csv.DictReader(open('/tmp/sheet-full.csv', encoding='utf-8')))
          if not rows:
              raise SystemExit('Abbruch: Sheet-Abruf leer — nichts committen.')

          # Schema-Guard (Welle F, 2026-07-27): fehlen Pflichtspalten (umbenannt/gelöscht),
          # bricht das Backup ab, statt ein kaputtes Backup zu committen.
          REQUIRED = {'id', 'name', 'lat', 'lon', 'typ', 'status', 'qualitaet', 'preis'}
          missing = REQUIRED - set(rows[0].keys())
          if missing:
              raise SystemExit('Abbruch: Schema-Drift — Spalte(n) fehlen: ' + ', '.join(sorted(missing)))

          # 1) Öffentliches CSV-Backup OHNE private Spalten
          fields = [f for f in rows[0].keys() if f not in PRIVATE]
          with open('data/sheet-backup.csv', 'w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              w.writeheader()
              for r in rows:
                  w.writerow({k: r.get(k, '') for k in fields})

          # 2) GeoJSON OHNE private Properties
          feats = [{"type": "Feature",
                    "geometry": {"type": "Point", "coordinates": [float(r['lon']), float(r['lat'])]},
                    "properties": {"id": r['id'], "name": r['name'], "typ": r['typ'], "status": r['status'],
                                   "q": r['qualitaet'], "p": r['preis'],
                                   "tags": r.get('tags', '')}}
                   for r in rows if r.get('lat') and r.get('lon') and r.get('id')]
          json.dump({"type": "FeatureCollection", "features": feats},
                    open('data/orte.geojson', 'w', encoding='utf-8'), ensure_ascii=False)
          print(len(feats), 'Orte gesichert (ohne private Felder:', ', '.join(sorted(PRIVATE)) + ')')
          EOF
      - name: Committen wenn geändert
        run: |
          git config user.name "restomap-backup"
          git config user.email "actions@users.noreply.github.com"
          git add data/sheet-backup.csv data/orte.geojson
          git diff --cached --quiet || git commit -m "Nightly-Backup $(date -u +%F)"
          git push
