<!DOCTYPE html>
<html lang="de">
<head>

<title>restomap · Berlin</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
  :root { --bg:#ffffff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e4e4e7; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map { position:absolute; inset:0; }

  /* Suche oben */
  #searchwrap { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:56px; z-index:5; }
  #search { width:100%; max-width:340px; padding:10px 14px; border:1px solid var(--line); border-radius:12px;
            font-size:16px; background:var(--bg); color:var(--ink); box-shadow:0 2px 10px rgba(0,0,0,.12); outline:none; }

  /* Filter-Panel unten */
  #panel { position:absolute; left:0; right:0; bottom:0; z-index:5; background:rgba(255,255,255,.96);
           backdrop-filter:blur(8px); border-top:1px solid var(--line);
           padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .row { display:flex; align-items:center; gap:8px; overflow-x:auto; scrollbar-width:none; padding:3px 0; }
  .row::-webkit-scrollbar { display:none; }

  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:0 0 auto; }
  .seg button { border:0; background:transparent; padding:7px 11px; font-size:13px; color:var(--muted); }
  .seg button.on { background:var(--ink); color:#fff; }

  .dot { width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);
         flex:0 0 auto; opacity:.25; transform:scale(.92); transition:all .15s; }
  .dot.on { opacity:1; transform:scale(1); box-shadow:0 0 0 1px rgba(0,0,0,.25); }

  .chip { flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
          padding:7px 12px; font-size:13px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #count { margin-left:auto; flex:0 0 auto; font-size:12px; color:var(--muted); padding-right:2px; }

  /* Legende */
  #legendbtn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:5; width:38px; height:38px;
               border-radius:50%; border:1px solid var(--line); background:var(--bg); font-size:16px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  #legend { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.35); display:none; align-items:flex-end; }
  #legend.open { display:flex; }
  #legend .sheet { background:#fff; width:100%; border-radius:16px 16px 0 0; padding:18px 20px calc(22px + env(safe-area-inset-bottom));
                   max-height:70%; overflow-y:auto; }
  #legend h3 { margin:0 0 10px; font-size:15px; }
  .lrow { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:14px; }
  .lrow .sw { width:20px; height:20px; border-radius:50%; flex:0 0 auto; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .lrow .sq { border-radius:5px; }

  .maplibregl-popup-content { border-radius:12px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.18); min-width:200px; }
  .p-name { font-weight:600; font-size:15px; margin-bottom:3px; padding-right:14px; }
  .p-meta { font-size:13px; color:var(--muted); margin-bottom:2px; }
  .p-note { font-size:12px; color:var(--muted); font-style:italic; margin-top:5px; }
  .p-link { display:inline-block; margin-top:8px; font-size:13px; color:#1a6fd4; text-decoration:none; }
  #err { position:absolute; top:40%; left:10%; right:10%; z-index:30; background:#fff; border:1px solid var(--line);
         border-radius:12px; padding:16px; font-size:14px; display:none; }
  #sharebtn { position:absolute; top:calc(56px + env(safe-area-inset-top)); right:10px; z-index:5; width:38px; height:38px;
              border-radius:50%; border:1px solid var(--line); background:var(--bg); font-size:15px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .p-statusbtn { display:block; width:100%; margin-top:9px; padding:8px 10px; border:0; border-radius:9px;
                 background:var(--ink); color:#fff; font-size:13px; }
  .lgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; }
  .lgrid .gi { display:flex; align-items:center; gap:7px; font-size:12.5px; }
  .lgrid canvas { width:26px; height:26px; flex:0 0 auto; }

<script>

/* ====== Konfiguration ====== */

               "Biergarten","Sushi","Eis","Weinbar","Burger","Steak/Grill","Fisch","Sport-/Kickerbar","Karaoke"];

function ratingKey(q, p) {
  if (p === "ueberteuert") return "orange";
  if (q === "nie_wieder")  return "rot";
  if (q === "top")         return p === "teuer" ? "lila" : "gold";
  if (q === "gut")         return "gruen";

}

function bar(c,x,y,w,h,centerX){ if(centerX){ c.fillRect(x-w/2,y-h/2,w,h);} else { c.fillRect(x-w/2,y,w,h);} }
function line(c,x1,y1,x2,y2,w){ c.lineWidth=w; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function dot(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,7); c.fill(); }
function ring(c,x,y,r,w){ c.lineWidth=w; c.beginPath(); c.arc(x,y,r,0,7); c.stroke(); }
function rr(c,x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); c.fill(); }

function makeIcon(typ, colorKey, square) {
  const S = 56, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d');
  c.save();
  if (square) { c.beginPath(); c.roundRect(3.5,3.5,S-7,S-7,7); }
  else { c.beginPath(); c.arc(S/2,S/2,S/2-3,0,7); }
  c.fillStyle = COLORS[colorKey]; c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=3; c.shadowOffsetY=1; c.fill();
  c.shadowColor='transparent'; c.lineWidth=3; c.strokeStyle='#fff'; c.stroke();
  c.restore();
  const g = GLYPH[typ] || GLYPH["Restaurant"];
  c.save(); c.fillStyle='#fff'; c.strokeStyle='#fff';
  if (typeof g === 'function') { c.translate(4,4); c.scale(2,2); g(c); }
  else { const px = 33, s = px/g.v; c.translate((S-px)/2,(S-px)/2); c.scale(s,s);
         for (const d of g.d) c.fill(new Path2D(d)); }
  c.restore();
  return c.getImageData(0,0,S,S);
}

/* ====== CSV-Parser (für Sheet-Quelle) ====== */
function parseCSV(text) {
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(cell!==''||row.length){ row.push(cell); rows.push(row); row=[]; cell=''; } }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift();
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));
}
function toFeatures(recs){
  return recs.filter(r=>r.lat&&r.lon&&r.id).map(r=>({ type:"Feature",
    geometry:{ type:"Point", coordinates:[+r.lon, +r.lat] },
    properties:{ id:r.id, name:r.name, typ:r.typ, status:r.status, q:r.qualitaet, p:r.preis,
                 notiz:r.notiz||'', tags:r.tags||'', besucht_am:r.besucht_am||'' } }));
}

/* ====== Edit-Modus (Token via ?edit=…, Schreib-URL via Einstellungs-Dialog) ====== */
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('edit')) {
  try { localStorage.setItem('rm_token', urlParams.get('edit')); } catch(e) {}
  urlParams.delete('edit'); // Token nicht in teilbarer URL lassen
  history.replaceState(null, '', location.pathname + (urlParams.toString()?'?'+urlParams.toString():'') + location.hash);
}
function getToken(){ try { return localStorage.getItem('rm_token') || ''; } catch(e) { return ''; } }
function getWriteUrl(){ try { return localStorage.getItem('rm_write_url') || WRITE_URL; } catch(e) { return WRITE_URL; } }
function askWriteUrl(){
  const u = prompt('Einmalige Einrichtung: URL der Apps-Script-Web-App einfügen (aus der Anleitung):', getWriteUrl());
  if (u && u.startsWith('https://')) { try { localStorage.setItem('rm_write_url', u.trim()); } catch(e) {} return u.trim(); }
  return '';
}
function toast(msg, ms=2500){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:80%;text-align:center';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', ms);
}
async function saveField(id, updates){
  let wu = getWriteUrl(); if (!wu) wu = askWriteUrl();
  if (!wu) { toast('Keine Schreib-URL hinterlegt.'); return false; }
  try {
    const res = await fetch(wu, { method:'POST', body: JSON.stringify({ token:getToken(), id, updates }) });
    const j = await res.json();
    if (!j.ok) { toast('Speichern fehlgeschlagen: ' + (j.error||'?')); return false; }
    return true;
  } catch(e) { toast('Speichern fehlgeschlagen (Netz?)'); return false; }
}

/* ====== State & Filter ====== */
const state = { status:"beide", ratings:new Set(Object.keys(COLORS)), types:new Set(), query:"" };
let allFeatures = [];

function matches(pr){
  if (state.status!=="beide" && pr.status!==state.status) return false;
  if (!state.ratings.has(pr.rk)) return false;
  if (state.types.size && !state.types.has(pr.typ)) return false;
  if (state.query && !pr.name.toLowerCase().includes(state.query)) return false;
  return true;
}
function applyFilter(){
  const visible = allFeatures.filter(f=>matches(f.properties));
  map.getSource('orte').setData({type:"FeatureCollection", features:visible});
  document.getElementById('count').textContent = visible.length + " Orte";
  stateToHash();
}

/* ====== Zustand ↔ URL (Teilen mit Filter + Ausschnitt) ====== */
let hashReady = false;
function stateToHash(){
  if (!hashReady) return;
  const p = new URLSearchParams();
  if (state.status !== 'beide') p.set('s', state.status);
  if (state.ratings.size < 6) p.set('r', [...state.ratings].join('.'));
  if (state.types.size) p.set('t', [...state.types].join('.'));
  if (state.query) p.set('q', state.query);
  const c = map.getCenter();
  p.set('m', c.lng.toFixed(5) + ',' + c.lat.toFixed(5) + ',' + map.getZoom().toFixed(2));
  history.replaceState(null, '', '#' + p.toString());
}
function applyHash(){
  if (!location.hash || location.hash.length < 2) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('s')) state.status = p.get('s');
  if (p.get('r')) state.ratings = new Set(p.get('r').split('.').filter(k => COLORS[k]));
  if (p.get('t')) state.types = new Set(p.get('t').split('.').filter(t => TYPES.includes(t)));
  if (p.get('q')) state.query = p.get('q');
  const m = p.get('m');
  if (m) { const [lng, lat, z] = m.split(',').map(Number);
           if (isFinite(lng) && isFinite(lat)) map.jumpTo({ center:[lng,lat], zoom: isFinite(z)?z:13 }); }
}

/* ====== Karte ====== */
const params = new URLSearchParams(location.search);
const style = params.get('basemap')==='blank'
  ? { version:8, glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
      sources:{}, layers:[{id:'bg',type:'background',paint:{'background-color':'#eceae4'}}] }
  : BASEMAP;

const map = new maplibregl.Map({ container:'map', style, center:[13.401,52.523], zoom:12.3,
                                 attributionControl:{compact:true} });
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}), 'top-right');

map.on('error', e => { const m=(e&&e.error&&e.error.message)||''; if(m) console.warn('[restomap] map error:', m); });

async function loadData(){
  if (SHEET_CSV_URL){
    try { const t=await (await fetch(SHEET_CSV_URL)).text(); return toFeatures(parseCSV(t)); }
    catch(e){ console.warn('[restomap] Sheet nicht erreichbar, nutze GeoJSON-Fallback', e); }
  }
  const gj = await (await fetch(DATA_URL)).json();
  return gj.features;
}

map.on('load', async () => {
  try {
    allFeatures = await loadData();
    allFeatures.forEach(f=>{ const pr=f.properties; pr.rk=ratingKey(pr.q,pr.p); pr.prioInv=5-PRIO[pr.rk];
                             pr.icon=pr.typ+"|"+pr.rk+"|"+(pr.status==="wunschliste"?"w":"b"); });
    for (const typ of TYPES) for (const ck of Object.keys(COLORS)) {
      map.addImage(typ+"|"+ck+"|b", makeIcon(typ,ck,false), {pixelRatio:2});
      map.addImage(typ+"|"+ck+"|w", makeIcon(typ,ck,true ), {pixelRatio:2});
    }
    map.addSource('orte', { type:'geojson', data:{type:"FeatureCollection",features:allFeatures}, promoteId:'id' });
    // Ein Layer: alle Icons immer sichtbar (My-Maps-Gefühl beim Rauszoomen, inkl. Flex-Faktor);
    // Zeichenreihenfolge über prioInv: Gold/Lila liegen oben. Namen ab Zoom 13,5, wo Platz ist.
    map.addLayer({ id:'pins', type:'symbol', source:'orte',
      layout:{ 'icon-image':['get','icon'], 'icon-allow-overlap':true,
               'symbol-sort-key':['get','prioInv'],
               'icon-size':['interpolate',['linear'],['zoom'], 8,0.34, 11,0.5, 13,0.7, 16,1],
               'text-field':['step',['zoom'],'',13.5,['get','name']], 'text-font':['Noto Sans Regular'],
               'text-size':11, 'text-offset':[0,1.6],
               'text-anchor':'top', 'text-optional':true },
      paint:{ 'text-color':'#333', 'text-halo-color':'#fff', 'text-halo-width':1.2 } });

    for (const layer of ['pins']) {
      map.on('click', layer, e => {
        const pr = e.features[0].properties;
        const [lon,lat] = e.features[0].geometry.coordinates;
        const gm = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
        const canEdit = !!getToken();
        const nextStatus = pr.status === 'besucht' ? 'wunschliste' : 'besucht';
        const popup = new maplibregl.Popup({offset:14}).setLngLat([lon,lat]).setHTML(
          `<div class="p-name">${esc(pr.name)}</div>
           <div class="p-meta">${esc(pr.typ)} · ${RLABEL[pr.rk]}</div>
           <div class="p-meta">${pr.status==="besucht"?"Besucht":"Watchlist"}</div>
           ${pr.notiz?`<div class="p-note">${esc(pr.notiz)}</div>`:''}
           <a class="p-link" href="${gm}" target="_blank" rel="noopener">In Google Maps öffnen ↗</a>
           ${canEdit?`<button class="p-statusbtn">${nextStatus==='besucht'?'✓ Als besucht markieren':'↩︎ Zurück auf die Watchlist'}</button>`:''}`).addTo(map);
        if (canEdit) popup.getElement().querySelector('.p-statusbtn').onclick = async () => {
          const feat = allFeatures.find(x => x.properties.id === pr.id);
          if (!feat) return;
          const old = feat.properties.status;
          const setStatus = s => { feat.properties.status = s;
            feat.properties.icon = feat.properties.typ+'|'+feat.properties.rk+'|'+(s==='wunschliste'?'w':'b'); };
          setStatus(nextStatus); applyFilter(); popup.remove();
          toast(nextStatus==='besucht' ? 'Gespeichert: Besucht ✓' : 'Gespeichert: Watchlist');
          const ok = await saveField(pr.id, { status: nextStatus });
          if (!ok) { setStatus(old); applyFilter(); }
        };
      });
      map.on('mouseenter', layer, ()=>map.getCanvas().style.cursor='pointer');
      map.on('mouseleave', layer, ()=>map.getCanvas().style.cursor='');
    }
    applyHash(); buildUI(); hashReady = true; applyFilter();
    map.on('moveend', () => stateToHash());
  } catch (err) {
    const el=document.getElementById('err'); el.style.display='block';
    el.textContent='Daten konnten nicht geladen werden: '+err.message; console.error(err);
  }
});

function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ====== UI ====== */
function buildUI(){
  // Status (Zustand ggf. aus URL wiederhergestellt)
  document.querySelectorAll('#statusseg button').forEach(b=>{
    b.classList.toggle('on', b.dataset.s===state.status);
    b.onclick=()=>{ document.querySelectorAll('#statusseg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); state.status=b.dataset.s; applyFilter(); };
  });
  // Bewertungs-Dots
  const dots=document.getElementById('ratingdots');
  for (const ck of ['gold','lila','gruen','grau','orange','rot']){
    const d=document.createElement('button'); d.className='dot'+(state.ratings.has(ck)?' on':'');
    d.style.background=COLORS[ck]; d.title=RLABEL[ck];
    d.onclick=()=>{ if(state.ratings.has(ck)){state.ratings.delete(ck); d.classList.remove('on');}
                    else {state.ratings.add(ck); d.classList.add('on');} applyFilter(); };
    dots.appendChild(d);
  }
  // Typ-Chips
  const chips=document.getElementById('chips');
  const counts={}; allFeatures.forEach(f=>counts[f.properties.typ]=(counts[f.properties.typ]||0)+1);
  const alle=document.createElement('button'); alle.className='chip'+(state.types.size?'':' on'); alle.textContent='Alle';
  alle.onclick=()=>{ state.types.clear(); chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
                     alle.classList.add('on'); applyFilter(); };
  chips.appendChild(alle);
  for (const t of [...TYPES].sort((a,b)=>(counts[b]||0)-(counts[a]||0))){
    const ch=document.createElement('button'); ch.className='chip'+(state.types.has(t)?' on':'');
    ch.textContent=`${t} ${counts[t]||0}`;
    ch.onclick=()=>{ if(state.types.has(t)){state.types.delete(t); ch.classList.remove('on');}
                     else {state.types.add(t); ch.classList.add('on');}
                     alle.classList.toggle('on', state.types.size===0); applyFilter(); };
    chips.appendChild(ch);
  }
  // Suche: Filter beim Tippen; Enter = ggf. Adress-Suche (Standort-Fallback ohne GPS)
  const search=document.getElementById('search');
  search.value=state.query;
  search.oninput=e=>{ state.query=e.target.value.trim().toLowerCase(); applyFilter(); };
  search.addEventListener('keydown', async e=>{
    if (e.key!=='Enter') return;
    const q=search.value.trim(); if(!q) return;
    const hits=allFeatures.filter(f=>f.properties.name.toLowerCase().includes(q.toLowerCase()));
    if (hits.length>=1){ map.flyTo({center:hits[0].geometry.coordinates, zoom:16}); return; }
    try {
      const r=await fetch('https://photon.komoot.io/api/?limit=1&lang=de&lat=52.52&lon=13.405&q='+encodeURIComponent(q));
      const j=await r.json(); const f=j.features&&j.features[0];
      if (f){ map.flyTo({center:f.geometry.coordinates, zoom:15.5}); toast('→ '+(f.properties.name||q)); }
      else toast('Nichts gefunden.');
    } catch(err){ toast('Adress-Suche gerade nicht erreichbar.'); }
  });
  // Teilen-Button: aktuelle Ansicht (Filter + Ausschnitt) als Link
  document.getElementById('sharebtn').onclick=async ()=>{
    stateToHash();
    const url=location.origin+location.pathname+location.hash;
    try { if (navigator.share) { await navigator.share({title:'restomap', url}); return; } } catch(e){ return; }
    try { await navigator.clipboard.writeText(url); toast('Link kopiert ✓'); }
    catch(e){ prompt('Link kopieren:', url); }
  };
  // Legende (mit Icon-Glossar); beim allerersten Besuch automatisch öffnen
  const leg=document.getElementById('legend');
  document.getElementById('legendbtn').onclick=()=>leg.classList.add('open');
  leg.onclick=e=>{ if(e.target===leg){ leg.classList.remove('open');
    try{ localStorage.setItem('rm_legend_seen','1'); }catch(err){} } };
  const lc=document.getElementById('legcolors');
  for (const ck of ['gold','lila','gruen','grau','orange','rot']){
    const r=document.createElement('div'); r.className='lrow';
    r.innerHTML=`<span class="sw" style="background:${COLORS[ck]}"></span> ${RLABEL[ck]}`; lc.appendChild(r);
  }
  const gi=document.getElementById('legicons');
  for (const t of TYPES){
    const cell=document.createElement('div'); cell.className='gi';
    const cv=document.createElement('canvas'); cv.width=cv.height=56;
    cv.getContext('2d').putImageData(makeIcon(t,'gold',false),0,0);
    cell.appendChild(cv);
    const lb=document.createElement('span'); lb.textContent=t; cell.appendChild(lb);
    gi.appendChild(cell);
  }
  let seen=false; try{ seen=!!localStorage.getItem('rm_legend_seen'); }catch(e){}
  if (!seen) leg.classList.add('open');
}
</script>
