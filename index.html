<style>
  :root { --bg:#ffffff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e4e4e7; --panel:rgba(255,255,255,.96); }
  body.dark { --bg:#212125; --ink:#f2f2f4; --muted:#a2a2a8; --line:#3a3a40; --panel:rgba(28,28,32,.94); }
  body.dark .chip, body.dark .a-chip, body.dark .p-tag { background:var(--bg); color:var(--ink); }
  body.dark .maplibregl-popup-content { background:#2a2a2f; color:#f2f2f4; }
  body.dark .maplibregl-popup-tip { border-top-color:#2a2a2f !important; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
              background:var(--bg); color:var(--ink); }
  #map { position:absolute; inset:0; }

  /* Suche oben */
  #searchwrap { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:56px; z-index:5; }
  #search { width:100%; max-width:340px; padding:10px 14px; border:1px solid var(--line); border-radius:12px;
            font-size:16px; background:var(--bg); color:var(--ink); box-shadow:0 2px 10px rgba(0,0,0,.12); outline:none; }

  /* Filter-Panel unten */
  #panel { position:absolute; left:0; right:0; bottom:0; z-index:5; background:var(--panel);
           backdrop-filter:blur(8px); border-top:1px solid var(--line);
           padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  #togglerow { align-items:center; }
  #morebtn { font-size:12px; color:var(--muted); }
  #morebtn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #morefilters { display:none; }
  .lbtn { display:block; width:100%; margin-top:12px; padding:10px; border:1px solid var(--line);
          border-radius:10px; background:var(--bg); color:var(--ink); font-size:14px; }
  #stats { position:absolute; inset:0; z-index:22; background:rgba(0,0,0,.35); display:none; align-items:flex-end; }
  #stats.open { display:flex; }
  #stats .sheet { background:var(--bg); color:var(--ink); width:100%; border-radius:16px 16px 0 0;
                  padding:18px 20px calc(24px + env(safe-area-inset-bottom)); max-height:80%; overflow-y:auto; }
  #stats h3 { margin:14px 0 8px; font-size:15px; } #stats h3:first-child { margin-top:0; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
  .kpi b { display:block; font-size:19px; } .kpi span { font-size:11.5px; color:var(--muted); }
  .brow { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:12.5px; }
  .brow .lbl { width:96px; flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brow .bar { height:13px; border-radius:4px; min-width:2px; }
  .brow .val { color:var(--muted); }
  .row { display:flex; align-items:center; gap:8px; overflow-x:auto; scrollbar-width:none; padding:3px 0; }
  .row::-webkit-scrollbar { display:none; }

  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:0 0 auto; }
  .seg button { border:0; background:transparent; padding:7px 11px; font-size:13px; color:var(--muted); }
  .seg button.on { background:var(--ink); color:#fff; }

  .dot { width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);
         flex:0 0 auto; opacity:.25; transform:scale(.92); transition:all .15s; }
  .dot.on { opacity:1; transform:scale(1); box-shadow:0 0 0 1px rgba(0,0,0,.25); }

  .chip { flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
          padding:7px 12px; font-size:13px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #count { margin-left:auto; flex:0 0 auto; font-size:12px; color:var(--muted); padding-right:2px; }

  /* Legende */
  #legendbtn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:5; width:38px; height:38px;
               border-radius:50%; border:1px solid var(--line); background:var(--bg); font-size:16px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  #legend { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.35); display:none; align-items:flex-end; }
  #legend.open { display:flex; }
  #legend .sheet { background:var(--bg); color:var(--ink); width:100%; border-radius:16px 16px 0 0;
                   padding:18px 20px calc(22px + env(safe-area-inset-bottom)); max-height:70%; overflow-y:auto; }
  #legend h3 { margin:0 0 10px; font-size:15px; }
  .lrow { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:14px; }
  .lrow .sw { width:20px; height:20px; border-radius:50%; flex:0 0 auto; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .lrow .sq { border-radius:5px; }

  .maplibregl-popup-content { border-radius:12px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.18); min-width:200px; max-width:270px; max-height:62vh; overflow-y:auto; }
  .p-name { font-weight:600; font-size:15px; margin-bottom:3px; padding-right:14px; }
  .p-meta { font-size:13px; color:var(--muted); margin-bottom:2px; }
  .p-note { font-size:12px; color:var(--muted); font-style:italic; margin-top:5px; }
  .p-danach { font-size:12px; margin-top:6px; line-height:1.5; }
  .p-danach-lbl { color:var(--muted); }
  .danach-lnk { background:none; border:0; color:#1a6fd4; font-size:12px; padding:0 1px; cursor:pointer; }
  body.dark .danach-lnk { color:#6db3ff; }
  .a-sel, #aquellefrei { width:100%; margin-top:8px; padding:9px 10px; border:1px solid var(--line);
          border-radius:10px; font-size:14px; background:var(--bg); color:var(--ink); }
  .p-link { display:inline-block; margin-top:8px; font-size:13px; color:#1a6fd4; text-decoration:none; }
  #err { position:absolute; top:40%; left:10%; right:10%; z-index:30; background:#fff; border:1px solid var(--line);
         border-radius:12px; padding:16px; font-size:14px; display:none; }
  #sharebtn { position:absolute; top:calc(56px + env(safe-area-inset-top)); right:10px; z-index:5; width:38px; height:38px;
              border-radius:50%; border:1px solid var(--line); background:var(--bg); font-size:15px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .p-statusbtn { display:block; width:100%; margin-top:9px; padding:8px 10px; border:0; border-radius:9px;
                 background:var(--ink); color:#fff; font-size:13px; }
  .p-visitbtn { display:block; width:100%; margin-top:6px; padding:8px 10px; border:0; border-radius:9px;
                background:#0F9D58; color:#fff; font-size:13px; }
  .p-tagrow { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .p-tag { flex:0 0 auto; padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:#fff;
           color:var(--muted); font-size:12.5px; }
  .p-tag.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .p-editbtn { display:block; width:100%; margin-top:8px; padding:7px 10px; border:1px solid var(--line);
               border-radius:9px; background:transparent; color:var(--muted); font-size:12.5px; }
  .p-edit { display:none; margin-top:8px; border-top:1px solid var(--line); padding-top:8px; }
  .p-edit.open { display:block; }
  .p-edit .p-elabel { font-size:11px; color:var(--muted); margin:6px 0 4px; text-transform:uppercase; letter-spacing:.03em; }
  .p-edit .a-row { margin:2px 0; }
  .p-etypes { display:flex; flex-wrap:wrap; gap:5px; max-height:132px; overflow-y:auto; }
  /* MapLibre-Controls (Zoom/Standort) unter die eigenen Buttons schieben statt drüber */
  .maplibregl-ctrl-top-right { top:calc(148px + env(safe-area-inset-top)); }
  #addbtn { position:absolute; top:calc(102px + env(safe-area-inset-top)); right:10px; z-index:5; width:38px; height:38px;
            border-radius:50%; border:1px solid var(--line); background:var(--ink); color:#fff; font-size:20px;
            box-shadow:0 2px 10px rgba(0,0,0,.12); display:none; }
  #addpanel { position:absolute; inset:0; z-index:25; background:rgba(0,0,0,.35); display:none; align-items:flex-end; }
  #addpanel.open { display:flex; }
  #addpanel .sheet { background:var(--bg); color:var(--ink); width:100%; border-radius:16px 16px 0 0;
                     padding:16px 18px calc(22px + env(safe-area-inset-bottom)); max-height:85%; overflow-y:auto; }
  #addpanel h3 { margin:0 0 8px; font-size:15px; }
  #addq { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .a-row { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
  .a-chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 10px; font-size:12.5px; }
  .a-chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .a-dot { width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); opacity:.35; }
  .a-dot.on { opacity:1; box-shadow:0 0 0 2px var(--ink); }
  .a-main { width:100%; margin-top:12px; padding:11px; border:0; border-radius:10px; background:var(--ink); color:#fff; font-size:14px; font-weight:600; }
  #aresult { margin-top:10px; padding:9px 11px; background:#f7f7f5; border-radius:9px; font-size:13px; display:none; }
  .lgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; }
  .lgrid .gi { display:flex; align-items:center; gap:7px; font-size:12.5px; }
  .lgrid canvas { width:26px; height:26px; flex:0 0 auto; }
</style>

<body>
<div id="map"></div>
<div id="searchwrap"><input id="search" type="search" placeholder="Ort oder Adresse suchen …" autocomplete="off"></div>
<button id="legendbtn" title="Legende">?</button>
<button id="sharebtn" title="Aktuelle Ansicht teilen">↗</button>
<button id="addbtn" title="Ort hinzufügen">+</button>
<div id="addpanel"><div class="sheet">
  <h3>Ort hinzufügen</h3>
  <input id="addq" type="text" placeholder="Google-Maps-Link einfügen oder Name eintippen …" autocomplete="off">
  <button class="a-main" id="alookup">Nachschlagen</button>
  <div id="aresult"></div>
  <div id="aform" style="display:none">
    <div class="a-row" id="atyps"></div>
    <div class="a-row" id="arates"></div>
    <div class="a-row" id="astatus">
      <button class="a-chip on" data-s="wunschliste">Watchlist</button>
      <button class="a-chip" data-s="besucht">Besucht</button>
    </div>
    <select id="aquelle" class="a-sel">
      <option value="Spontanfund">Quelle: Spontanfund</option>
      <option value="tip">tip</option>
      <option value="tip Speisekarte">tip Speisekarte</option>
      <option value="Mit Vergnügen">Mit Vergnügen</option>
      <option value="CeeCee">CeeCee</option>
      <option value="Tagesspiegel">Tagesspiegel</option>
      <option value="Monats-Check">Monats-Check</option>

</div></div>
<div id="panel">
  <div class="row" id="anlassrow"></div>
  <div class="row" id="togglerow">
    <button id="morebtn" class="chip">⚙︎ Filter</button>
    <span id="count"></span>
  </div>
  <div id="morefilters">
    <div class="row" id="row1">
      <div class="seg" id="statusseg">
        <button data-s="beide" class="on">Beide</button>
        <button data-s="besucht">Besucht</button>
        <button data-s="wunschliste">Watchlist</button>
      </div>
    </div>
    <div class="row" id="chips"></div>
  </div>
</div>
<div id="legend"><div class="sheet">
  <h3>Farbe = Bewertung <span style="font-size:10px;font-weight:400;color:var(--muted);vertical-align:super" title="Welcher Stand läuft? (Cache-Kontrolle)">b28-6</span></h3><div id="legcolors"></div>
  <h3 style="margin-top:14px">Form = Status</h3>
  <div class="lrow"><span class="sw" style="background:#888"></span> Kreis = besucht</div>
  <div class="lrow"><span class="sw sq" style="background:#888"></span> Quadrat = Watchlist (noch nicht besucht)</div>
  <h3 style="margin-top:14px">Icon = Typ</h3>
  <div class="lgrid" id="legicons"></div>
  <button class="lbtn" id="statsbtn">📊 Statistik anzeigen</button>
  <button class="lbtn" id="rolbtn">🎲 Zufalls-Vorschlag (aus aktivem Filter)</button>
  <button class="lbtn" id="themebtn">🌙 Darstellung: Auto</button>
  <button class="lbtn" id="basembtn">🗺 Karte: Schlicht</button>
  <p style="font-size:12px;color:var(--muted)">Icon auf dem Pin = Typ (Pizza, Bar, Café …). Beim Rauszoomen bleiben alle Orte sichtbar; bessere Bewertungen liegen oben. restomap</p>
</div></div>
<div id="stats"><div class="sheet" id="statsbody"></div></div>
<div id="err"></div>

<script>
'use strict';
/* ====== Konfiguration ====== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/18nYehpbpOmARe9NI6EXdKKFiYG53C3OMgKm4A5CuLFk/gviz/tq?tqx=out:csv";
const DATA_URL = "data/orte.geojson";   // Fallback, falls das Sheet nicht erreichbar ist
const WRITE_URL = "https://script.google.com/macros/s/AKfycbyxI4tO5BqzceSnml-mbChZitp5SzfcUyJfBpYdlWvf4TWTB3aKVigIWKoGbZL_BeDL/exec";
const BASEMAP = "https://tiles.openfreemap.org/styles/positron";

/* Welle F (2026-07-27) — Grau-Split: 'unbew' = eigener Render-Key für qualitaet=unbewertet
   (gedimmt, UNBEW_ALPHA); 'grau' = sattes Grau = bewusstes Urteil „Mittel".
   'unbew' steht bewusst am ENDE von RATE_ORDER (alte r=-Teilen-Links bleiben gültig). */
const COLORS = { gold:"#F0A800", lila:"#9C27B0", gruen:"#0F9D58", blau:"#1976D2", orange:"#E65100", grau:"#8A8A8E", rot:"#7B1420", unbew:"#8A8A8E" };
const UNBEW_ALPHA = 0.55;            // Deckkraft der „ohne Urteil"-Pins (Martins Abnahme: V1 gedimmt)
const PRIO   = { gold:0, lila:1, rot:2, orange:3, gruen:4, blau:5, grau:6, unbew:7 };
const PRIO_MAX = Math.max(...Object.values(PRIO));   // z-Reihenfolge: hoeher = zeichnet oben
const RLABEL = { gold:"Sehr gut", lila:"Sehr gut · Anlass (teuer)", gruen:"Sehr gut & günstig",
                 blau:"Gut", orange:"Zu teuer (P/L)", grau:"Mittel", unbew:"Ohne Urteil", rot:"Nie wieder" };
// „Und danach?" temporär aus der UI (Martin, 27.07.2026) — Neukonzept (zeit- & typabhängig) kommt in Welle K.
const FEATURE_DANACH = false;
/* Datenlogik v2 (2026-07-20): typ = Speisen-/Venue-Schwerpunkt (Icon) · kueche = Herkunft (später Flaggen-Badge)
   · Anlass-Tags (fruehstueck/brunch/lunch/kaffee/dinner/drinks) = erste Filter-Weiche, nur Filter, keine Pin-Optik. */
const TYPES = ["Restaurant","Asia","Café","Kneipe","Cocktail-Bar","Imbiss","Pizza","Club/Livemusik",
               "Biergarten","Sushi","Eis","Weinbar","Burger","Steak/Grill","Fisch","Sportsbar","Karaoke",
               "Bäcker","Dessert"];
// Alt-Werte (Sheet vor Migration, alte Teilen-Links) → neue Typen
const TYP_ALIAS = { "Bar":"Cocktail-Bar", "Sport-/Kickerbar":"Sportsbar", "Frühstück":"Restaurant" };
// Kurzformen für enge UI-Stellen (Chips); Langform bleibt in Legende/Popup
const TYP_SHORT = { "Cocktail-Bar":"Bar" };
const TYP_LEGENDE = { "Asia":"Asia · Suppen/Nudeln" };
// Anlass-Weiche: Chip → Tag-Menge (OR innerhalb des Chips und zwischen Chips)
const ANLAESSE = [ { key:'fruehstueck', label:'Frühstück', tags:['fruehstueck','brunch'] },
                   { key:'lunch',       label:'Lunch',     tags:['lunch'] },
                   { key:'kaffee',      label:'Kaffee',    tags:['kaffee'] },
                   { key:'dinner',      label:'Dinner',    tags:['dinner'] },
                   { key:'drinks',      label:'Drinks',    tags:['drinks'] },
                   { key:'music',       label:'Musik',     tags:['music'] } ];
// Anlass-Vorbelegung beim Neuanlegen (identisch zu den Migrations-Regeln)
const ANLASS_DEFAULT = { "Restaurant":["lunch","dinner"], "Asia":["lunch","dinner"], "Sushi":["lunch","dinner"],
  "Pizza":["lunch","dinner"], "Burger":["lunch","dinner"], "Steak/Grill":["lunch","dinner"],
  "Fisch":["lunch","dinner"], "Imbiss":["lunch","dinner"], "Café":["fruehstueck","kaffee"],
  "Bäcker":["fruehstueck","kaffee"], "Eis":["kaffee"], "Dessert":["kaffee"],
  "Biergarten":["kaffee","dinner","drinks"], "Cocktail-Bar":["drinks"], "Weinbar":["drinks"],
  "Kneipe":["drinks"], "Sportsbar":["drinks"], "Club/Livemusik":["drinks","music"], "Karaoke":["drinks","music"] };

/* ====== Bewertungs-Farblogik (Welle F, Entscheidung 1) ======
   Zielmodell: qualitaet ∈ {sehr_gut, gut, mittel, nie_wieder, unbewertet} · preis orthogonal ·
   Farbe IMMER berechnet, nie gespeichert. Alt-Werte (top, gut_blau, Legacy-gut) werden hier
   normalisiert, damit die UI VOR und NACH der Sheet-Migration identisch rendert (Deploy-Regel:
   erst UI, dann Migration).
   LEGACY_GUT: solange der Datensatz noch Alt-Werte (top/gut_blau) enthält, heißt 'gut' das
   ALTE Grün („Gold in günstig" bei guenstig). Nach der Migration existieren die Alt-Werte
   nicht mehr → 'gut'ד guenstig" ist dann eine legitime Blau-Kombination. */
let LEGACY_GUT = false;   // wird beim Datenladen gesetzt (Alt-Werte im Datensatz vorhanden?)
function normQ(q, p) {
  if (q === "top")      return "sehr_gut";
  if (q === "gut_blau") return "gut";
  if (q === "gut" && LEGACY_GUT) return p === "guenstig" ? "sehr_gut" : "gut";
  return q;
}
function ratingKey(q, p) {
  q = normQ(q, p);
  if (p === "ueberteuert")  return "orange";           // explizites P/L-Veto dominiert (auch bei unbewertet)
  if (q === "nie_wieder")   return "rot";              // „schlecht" -> Dunkelrot-Achteck (Form in makeIcon)
  if (q === "sehr_gut")     return p === "teuer" ? "lila" : (p === "guenstig" ? "gruen" : "gold");
  if (q === "gut")          return p === "teuer" ? "orange" : "blau";   // P/L-Veto abgeleitet (Entscheidung 1b)
  if (q === "mittel")       return p === "teuer" ? "orange" : "grau";
  return "unbew";                                      // unbewertet/leer -> gedimmt (Grau-Split, Entscheidung 6)
}

/* ============================================================================
   restomap · Icon-Glyphen v6 — alle 19 Typen (final, 2026-07-23)
   Drop-in-Ersatz fuer den Icon-Block in index.html:
   ersetzt den Abschnitt von `const GLYPH = {` bis Ende `function makeIcon(...)`.
   Enthaelt Helfer bar/line/dot/ring/rr/cut/uncut (cut/uncut sind neu).
   Nutzt die vorhandene COLORS-Konstante der App.
   - 9 getracte Icons: Pfad-Glyphen mit eingebautem Fit (translate/scale).
   - 10 Vektor-Icons: gezeichnete Funktionen in der 24x24-Box.
   WICHTIG: makeIcon zeichnet den Glyph auf einen SEPARATEN Canvas und setzt ihn auf.
   Nur so scheinen destination-out-Kerben (cut/uncut) in Pin-Farbe durch, statt ein
   transparentes Loch zu stanzen. (Function-Glyph: translate(4,4);scale(2,2) | {v,d}: px=33.)
   ========================================================================== */

function bar(c,x,y,w,h,centerX){ if(centerX){ c.fillRect(x-w/2,y-h/2,w,h);} else { c.fillRect(x-w/2,y,w,h);} }
function line(c,x1,y1,x2,y2,w){ c.lineWidth=w; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }

function octa(c,cx,cy,r){ c.beginPath(); for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4,
  x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); if(i)c.lineTo(x,y); else c.moveTo(x,y);} c.closePath(); }
function makeIcon(typ, colorKey, square) {
  const S = 56, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d');
  // Grau-Split (Welle F): „ohne Urteil" = gleicher Grauton, aber gedimmt (V1, Martins Abnahme).
  if (colorKey === 'unbew') c.globalAlpha = UNBEW_ALPHA;
  // Pin (Kreis · abgerundetes Quadrat · Achteck fuer „schlecht"/nie_wieder)
  c.save();
  if (square) { c.beginPath(); c.roundRect(3.5,3.5,S-7,S-7,7); }
  else if (colorKey === 'rot') { octa(c, S/2, S/2, S/2-2.5); }
  else { c.beginPath(); c.arc(S/2,S/2,S/2-3,0,7); }
  c.fillStyle = COLORS[colorKey]; c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=3; c.shadowOffsetY=1; c.fill();
  c.shadowColor='transparent'; c.lineWidth=3; c.strokeStyle='#fff'; c.stroke();
  c.restore();
  // Glyph auf SEPARATEM Canvas zeichnen, dann aufsetzen — so scheinen destination-out-Kerben
  // (cut/uncut) in Pin-Farbe durch, statt ein transparentes Loch zu stanzen.
  const g = GLYPH[typ] || GLYPH["Restaurant"];
  const gcv = document.createElement('canvas'); gcv.width = gcv.height = S;
  const gc = gcv.getContext('2d');
  gc.fillStyle='#fff'; gc.strokeStyle='#fff';
  if (typeof g === 'function') { gc.translate(4,4); gc.scale(2,2); g(gc); }
  else { const px = 33, s = px/g.v; gc.translate((S-px)/2,(S-px)/2); gc.scale(s,s);
         for (const d of g.d) gc.fill(new Path2D(d)); }
  c.drawImage(gcv,0,0);
  return c.getImageData(0,0,S,S);
}

/* ====== CSV-Parser (für Sheet-Quelle) ====== */
function parseCSV(text) {
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(cell!==''||row.length){ row.push(cell); rows.push(row); row=[]; cell=''; } }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift();
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));
}
function toFeatures(recs){
  return recs.filter(r=>r.lat&&r.lon&&r.id).map(r=>({ type:"Feature",
    geometry:{ type:"Point", coordinates:[+r.lon, +r.lat] },
    properties:{ id:r.id, name:r.name, typ:r.typ, status:r.status, q:r.qualitaet, p:r.preis,
                 notiz:r.notiz||'', tags:r.tags||'', besucht_am:r.besucht_am||'' } }));
}

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('edit')) {
  try { localStorage.setItem('rm_token', urlParams.get('edit')); } catch(e) {}
  urlParams.delete('edit'); // Token nicht in teilbarer URL lassen
  history.replaceState(null, '', location.pathname + (urlParams.toString()?'?'+urlParams.toString():'') + location.hash);
}
function getToken(){ try { return localStorage.getItem('rm_token') || ''; } catch(e) { return ''; } }
function storedWriteUrl(){ try { return (localStorage.getItem('rm_write_url')||'').trim(); } catch(e){ return ''; } }
function verwerfeWriteUrl(){ try { localStorage.removeItem('rm_write_url'); } catch(e){} }
/* Hinterlegte URL gewinnt — aber nur in gültiger Form; tote URLs verwirft postJson zur Laufzeit. */
function getWriteUrl(){ const u = storedWriteUrl();
  return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\b/.test(u) ? u : WRITE_URL; }
function askWriteUrl(){
  const u = prompt('Einmalige Einrichtung: URL der Apps-Script-Web-App einfügen (aus der Anleitung):', getWriteUrl());
  if (u && u.startsWith('https://')) { try { localStorage.setItem('rm_write_url', u.trim()); } catch(e) {} return u.trim(); }
  return '';
}
function toast(msg, ms=2500){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:80%;text-align:center';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', ms);
}
let lastErr = '', lastErrDetail = '';
/* Ein Versuch. Wirft mit .code: 'http:<status>' | 'parse' (Antwort war kein JSON — Apps Script
   liefert sporadisch eine Google-Drive-Fehlerseite) | 'netz' (Anfrage kam nicht durch / CORS). */
async function postOnce(wu, payload){
  let res;
  try { res = await fetch(wu, { method:'POST', body: JSON.stringify({ token:getToken(), ...payload }) }); }
  catch(e){ const err=new Error('netz'); err.code='netz'; err.detail=String(e.message||e); throw err; }
  const txt = await res.text();
  if (!res.ok){ const err=new Error('http'); err.code='http:'+res.status; err.detail=txt.slice(0,160); throw err; }
  try { return JSON.parse(txt); }
  catch(_){ const err=new Error('parse'); err.code='parse'; err.detail=txt.slice(0,160); throw err; }
}
/* Transiente Google-Aussetzer einmal still wiederholen; fachliche Fehler (ok:false) nicht. */
async function postJson(payload){
  let urlVerworfen = false, transientVersucht = false;
  for (;;) {
    const wu = getWriteUrl();
    try {
      const j = await postOnce(wu, payload);
      if (!j.ok) { lastErr = j.error||'?'; lastErrDetail=''; toast('Fehler: ' + lastErr); return null; }
      lastErr = ''; lastErrDetail=''; return j;
    } catch(e) {
      lastErr = e.code || 'netz'; lastErrDetail = e.detail || '';
      console.warn('[restomap] Schreibversuch fehlgeschlagen:', lastErr, wu, lastErrDetail);
      const istHttp4 = /^http:4/.test(lastErr);
      if (istHttp4 && wu !== WRITE_URL && !urlVerworfen){   // tote hinterlegte URL verwerfen
        urlVerworfen = true; verwerfeWriteUrl();
        toast('Veraltete Schreib-URL verworfen — neuer Versuch');
        continue;
      }
      if (!istHttp4 && !transientVersucht){                 // 4xx heilt kein Warten
        transientVersucht = true; await new Promise(r=>setTimeout(r, 900)); continue;
      }
      toast('Nicht gespeichert (' + lastErr + ')');
      return null;
    }
  }
}

function saveBanner(){ let b=document.getElementById('saveErr');

/* Klartext statt Fehlercode — sagt, was zu prüfen ist (deckungsgleich mit review.html). */
function errText(code){
  if (code==='auth') return ERR_AUTH;
  if (code==='netz') return '<b>Nicht gespeichert — Server nicht erreichbar.</b> Die Anfrage kam nicht bei Google an '
    + '(auch nach einem automatischen zweiten Versuch). Meist ein vorübergehender Apps-Script-Aussetzer — '
    + 'gleich nochmal tippen. Hält es an: <code>/exec</code> im Browser öffnen, dort sollte <code>version:7</code> stehen.';
  if (code==='parse') return '<b>Nicht gespeichert — unerwartete Antwort von Google.</b> Statt JSON kam eine '
    + 'HTML-Seite (typisch: vorübergehende Google-Störung, seltener eine abgelaufene Bereitstellung). '
    + 'Gleich nochmal versuchen; hält es an, <code>/exec</code> im Browser prüfen.';
  if (String(code).startsWith('http:')) return '<b>Nicht gespeichert — Google antwortete mit '+esc(code)+'.</b> '
    + 'Bei 401/403 stimmt der Zugriff der Bereitstellung nicht; bei 5xx ist es meist vorübergehend.';
  return '<b>Nicht gespeichert</b> (Fehler: '+esc(code||'?')+'). Bitte erneut versuchen.';
}
async function commit(payload){ const ok=!!(await postJson(payload));
  if(!ok) saveErrShow(errText(lastErr) + (lastErrDetail ? '<br><small>Antwort: '+esc(lastErrDetail)+'</small>' : ''));
  else saveErrHide(); return ok; }
async function saveField(id, updates){ return await commit({ id, updates }); }

/* ====== State & Filter ====== */
const state = { status:"beide", ratings:new Set(Object.keys(COLORS)), types:new Set(), query:"",
                price:"alle", mtags:new Set(), anlass:new Set() };
let allFeatures = [];

const PRICEMAP = { "€":["guenstig"], "€€":["normal"], "€€€":["teuer","ueberteuert"] };
function matches(pr){
  if (state.status!=="beide" && pr.status!==state.status) return false;
  if (!state.ratings.has(pr.rk)) return false;
  if (state.types.size && !state.types.has(pr.typ)) return false;
  if (state.price!=="alle" && !PRICEMAP[state.price].includes(pr.p)) return false;
  if (state.anlass.size){ const t=(pr.tags||'').toLowerCase(); let hit=false;
    for (const a of ANLAESSE) if (state.anlass.has(a.key) && a.tags.some(tg=>t.includes(tg))) { hit=true; break; }
    if (!hit) return false; }
  if (state.mtags.size){ const t=(pr.tags||'').toLowerCase();
    for (const tg of state.mtags) if (!t.includes(tg)) return false; }
  if (state.query && !pr.name.toLowerCase().includes(state.query)) return false;
  return true;
}
function applyFilter(){
  const visible = allFeatures.filter(f=>matches(f.properties));
  map.getSource('orte').setData({type:"FeatureCollection", features:visible});
  document.getElementById('count').textContent = visible.length + " Orte";
  stateToHash();
}

/* ====== Zustand ↔ URL (Teilen mit Filter + Ausschnitt) ====== */
let hashReady = false;
function stateToHash(){
  if (!hashReady) return;
  const p = new URLSearchParams();
  if (state.status !== 'beide') p.set('s', state.status);
  if (state.ratings.size < Object.keys(COLORS).length) p.set('r', [...state.ratings].join('.'));
  if (state.types.size) p.set('t', [...state.types].join('.'));
  if (state.price!=='alle') p.set('p', state.price);
  if (state.anlass.size) p.set('a', [...state.anlass].join('.'));
  if (state.mtags.size) p.set('tg', [...state.mtags].join('.'));
  if (state.query) p.set('q', state.query);
  const c = map.getCenter();
  p.set('m', c.lng.toFixed(5) + ',' + c.lat.toFixed(5) + ',' + map.getZoom().toFixed(2));
  history.replaceState(null, '', '#' + p.toString());
}
function applyHash(){
  if (!location.hash || location.hash.length < 2) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('s')) state.status = p.get('s');
  if (p.get('r')) state.ratings = new Set(p.get('r').split('.').filter(k => COLORS[k]));
  if (p.get('t')) state.types = new Set(p.get('t').split('.').map(t => TYP_ALIAS[t]||t).filter(t => TYPES.includes(t)));
  if (p.get('p') && PRICEMAP[p.get('p')]) state.price = p.get('p');
  if (p.get('a')) state.anlass = new Set(p.get('a').split('.').filter(k => ANLAESSE.some(x=>x.key===k)));
  // Alt-Links: tg=lunch/dinner (frühere Tag-Chips) → Anlass-Weiche
  if (p.get('tg')) for (const t of p.get('tg').split('.'))
    if (['lunch','dinner'].includes(t)) state.anlass.add(t);
  if (p.get('q')) state.query = p.get('q');
  const m = p.get('m');
  if (m) { const [lng, lat, z] = m.split(',').map(Number);
           if (isFinite(lng) && isFinite(lat)) map.jumpTo({ center:[lng,lat], zoom: isFinite(z)?z:13 }); }
}

/* ====== Schema-Guard, Lese-Seite (Welle F): warnen statt still falsch rendern ======
   Schreiben validiert der Server (Code v7) streng; hier bleibt die Karte benutzbar,
   macht aber laut auf Drift aufmerksam (Sheet-Direktedits sind ausdrücklich legitim). */
function schemaWarn(recs){
  if (!recs.length) return;
  const REQ = ['id','name','lat','lon','typ','status','qualitaet','preis'];
  const have = Object.keys(recs[0]);
  const missing = REQ.filter(c=>!have.includes(c));
  if (missing.length){
    const el=document.getElementById('err'); el.style.display='block';
    el.textContent='⚠ Schema-Problem im Sheet: Spalte(n) fehlen/umbenannt: '+missing.join(', ')+
                   ' — Karte kann Falschfarben zeigen.';
    console.warn('[restomap] Schema-Drift:', missing);
  }
  const VQ=['sehr_gut','gut','mittel','unbewertet','nie_wieder','top','gut_blau',''];
  const VP=['guenstig','normal','teuer','ueberteuert',''];
  const bad={};
  recs.forEach(r=>{ const q=String(r.qualitaet??'').trim(), p=String(r.preis??'').trim();
    if(!VQ.includes(q)) bad['qualitaet='+q]=(bad['qualitaet='+q]||0)+1;
    if(!VP.includes(p)) bad['preis='+p]=(bad['preis='+p]||0)+1; });
  const keys=Object.keys(bad);
  if (keys.length){
    console.warn('[restomap] Unbekannte Werte im Sheet (Tippfehler?):', bad);
    toast('⚠ Unbekannte Werte im Sheet: '+keys.slice(0,3).join(', ')+(keys.length>3?' …':''), 6000);
  }
}
async function loadData(){
  if (SHEET_CSV_URL){
    try { const t=await (await fetch(SHEET_CSV_URL)).text();
          const recs=parseCSV(t); schemaWarn(recs); return toFeatures(recs); }
    catch(e){ console.warn('[restomap] Sheet nicht erreichbar, nutze GeoJSON-Fallback', e); }
  }
  const gj = await (await fetch(DATA_URL)).json();
  return gj.features;
}

/* ====== „Und danach?" — nächste gute Bar/Eis zu Fuß (Luftlinie, client-seitig) ====== */
const DANACH_FOOD = new Set(['Restaurant','Asia','Sushi','Pizza','Burger','Steak/Grill','Fisch','Imbiss','Café','Bäcker']);
const DANACH_DRINKS = new Set(['Cocktail-Bar','Weinbar','Kneipe','Biergarten','Sportsbar','Club/Livemusik']);
const DANACH_SWEET = new Set(['Eis','Dessert']);
function distM(lat1,lon1,lat2,lon2){ const R=6371000, rad=Math.PI/180;
  const x=(lat2-lat1)*rad, y=(lon2-lon1)*rad*Math.cos((lat1+lat2)/2*rad); return R*Math.sqrt(x*x+y*y); }
function nearestOf(lon, lat, typesSet, maxM, exclId){
  const good=['gold','lila','gruen','blau']; const cand=[];
  for (const f of allFeatures){ const p=f.properties;
    if (p.id===exclId || !typesSet.has(p.typ) || p.rk==='rot') continue;
    const c=f.geometry.coordinates; const d=distM(lat,lon,c[1],c[0]);
    if (d<maxM) cand.push({f:f, d:d, good:good.indexOf(p.rk)>=0}); }
  if (!cand.length) return null;
  const goods=cand.filter(c=>c.good); const pool=goods.length?goods:cand;
  pool.sort((a,b)=>a.d-b.d); return { f:pool[0].f, d:Math.round(pool[0].d) };
}
function danachLine(pr, lon, lat){
  if (!FEATURE_DANACH) return '';   // temporär aus (Martin, 27.07.2026) — Code bleibt für „Und danach? v2" (Welle K)
  if (!DANACH_FOOD.has(pr.typ)) return '';
  const bar=nearestOf(lon,lat,DANACH_DRINKS,600,pr.id), sweet=nearestOf(lon,lat,DANACH_SWEET,600,pr.id);
  const parts=[];
  if (bar)   parts.push(`<button class="danach-lnk" onclick="gotoPlace('${bar.f.properties.id}')">🍸 ${esc(bar.f.properties.name)} · ${bar.d} m</button>`);
  if (sweet) parts.push(`<button class="danach-lnk" onclick="gotoPlace('${sweet.f.properties.id}')">🍨 ${esc(sweet.f.properties.name)} · ${sweet.d} m</button>`);
  if (!parts.length) return '';
  return `<div class="p-danach"><span class="p-danach-lbl">Und danach?</span> ${parts.join(' ')}</div>`;
}
function gotoPlace(id){ const f=allFeatures.find(x=>x.properties.id===id); if(!f) return;
  const c=f.geometry.coordinates; map.flyTo({ center:[c[0],c[1]], zoom:16 }); openPopup(f); }

  for (const a of ANLAESSE){
    const ch=document.createElement('button'); ch.className='chip'+(state.anlass.has(a.key)?' on':'');
    ch.textContent=a.label;
    ch.onclick=()=>{ if(state.anlass.has(a.key)){state.anlass.delete(a.key); ch.classList.remove('on');}
                     else {state.anlass.add(a.key); ch.classList.add('on');} applyFilter(); };
    arow.appendChild(ch);
  }
  // Typ-Chips (zweite Ebene)
  const chips=document.getElementById('chips');
  const counts={}; allFeatures.forEach(f=>counts[f.properties.typ]=(counts[f.properties.typ]||0)+1);
  const alle=document.createElement('button'); alle.className='chip'+(state.types.size?'':' on'); alle.textContent='Alle';
  alle.onclick=()=>{ state.types.clear(); chips.querySelectorAll('.chip[data-typ]').forEach(x=>x.classList.remove('on'));
                     alle.classList.add('on'); applyFilter(); };
  chips.appendChild(alle);
  for (const t of [...TYPES].sort((a,b)=>(counts[b]||0)-(counts[a]||0))){
    if (!(counts[t]) && !state.types.has(t)) continue; // leere neue Typen (Bäcker/Dessert) erst zeigen, wenn es Orte gibt
    const ch=document.createElement('button'); ch.className='chip'+(state.types.has(t)?' on':'');
    ch.dataset.typ=t; ch.textContent=`${TYP_SHORT[t]||t} ${counts[t]||0}`;
    ch.onclick=()=>{ if(state.types.has(t)){state.types.delete(t); ch.classList.remove('on');}
                     else {state.types.add(t); ch.classList.add('on');}
                     alle.classList.toggle('on', state.types.size===0); applyFilter(); };
    chips.appendChild(ch);
  }
  // Suche: Filter beim Tippen; Enter = ggf. Adress-Suche (Standort-Fallback ohne GPS)
  const search=document.getElementById('search');
  search.value=state.query;
  search.oninput=e=>{ state.query=e.target.value.trim().toLowerCase(); applyFilter(); };
  search.addEventListener('keydown', async e=>{
    if (e.key!=='Enter') return;
    const q=search.value.trim(); if(!q) return;
    const hits=allFeatures.filter(f=>f.properties.name.toLowerCase().includes(q.toLowerCase()));
    if (hits.length>=1){ map.flyTo({center:hits[0].geometry.coordinates, zoom:16}); return; }
    try {
      const r=await fetch('https://photon.komoot.io/api/?limit=1&lang=de&lat=52.52&lon=13.405&q='+encodeURIComponent(q));
      const j=await r.json(); const f=j.features&&j.features[0];
      if (f){ map.flyTo({center:f.geometry.coordinates, zoom:15.5}); toast('→ '+(f.properties.name||q)); }
      else toast('Nichts gefunden.');
    } catch(err){ toast('Adress-Suche gerade nicht erreichbar.'); }
  });
  // Teilen-Button: aktuelle Ansicht (Filter + Ausschnitt) als Link
  document.getElementById('sharebtn').onclick=async ()=>{
    stateToHash();
    const url=location.origin+location.pathname+location.hash;
    try { if (navigator.share) { await navigator.share({title:'restomap', url}); return; } } catch(e){ return; }
    try { await navigator.clipboard.writeText(url); toast('Link kopiert ✓'); }
    catch(e){ prompt('Link kopieren:', url); }
  };
  // Legende (mit Icon-Glossar); beim allerersten Besuch automatisch öffnen
  const leg=document.getElementById('legend');
  document.getElementById('legendbtn').onclick=()=>leg.classList.add('open');
  leg.onclick=e=>{ if(e.target===leg){ leg.classList.remove('open');
    try{ localStorage.setItem('rm_legend_seen','1'); }catch(err){} } };
  const lc=document.getElementById('legcolors');
  for (const ck of RATE_ORDER){
    const r=document.createElement('div'); r.className='lrow';
    const dim = ck==='unbew' ? `opacity:${UNBEW_ALPHA}` : '';
    r.innerHTML=`<span class="sw" style="background:${COLORS[ck]};${dim}"></span> ${RLABEL[ck]}`; lc.appendChild(r);
  }
  const gi=document.getElementById('legicons');
  for (const t of TYPES){
    const cell=document.createElement('div'); cell.className='gi';
    const cv=document.createElement('canvas'); cv.width=cv.height=56;
    cv.getContext('2d').putImageData(makeIcon(t,'gold',false),0,0);
    cell.appendChild(cv);
    const lb=document.createElement('span'); lb.textContent=TYP_LEGENDE[t]||t; cell.appendChild(lb);
    gi.appendChild(cell);
  }
  let seen=false; try{ seen=!!localStorage.getItem('rm_legend_seen'); }catch(e){}
  if (!seen) leg.classList.add('open');
  initAdd();
  // 🎲 Roulette (2026-07-21 in die Legende verschoben — Usecase wird später neu bewertet)
  document.getElementById('rolbtn').onclick=()=>{
    const vis=allFeatures.filter(f=>matches(f.properties));
    if(!vis.length){ toast('Kein Ort im aktiven Filter'); return; }
    const f=vis[Math.floor(Math.random()*vis.length)];
    leg.classList.remove('open');
    map.flyTo({ center:f.geometry.coordinates, zoom:16 });
    setTimeout(()=>openPopup(f), 650);
    toast('🎲 '+f.properties.name);
  };
  // 📊 Statistik
  const stats=document.getElementById('stats');
  document.getElementById('statsbtn').onclick=()=>{ renderStats(); leg.classList.remove('open'); stats.classList.add('open'); };
  stats.onclick=e=>{ if(e.target===stats) stats.classList.remove('open'); };
  // 🌙 Theme
  document.getElementById('themebtn').onclick=()=>{
    const order=['auto','hell','dunkel'];
    const next=order[(order.indexOf(themePref())+1)%3];
    try{ localStorage.setItem('rm_theme', next); }catch(e){}
    applyTheme();
  };
  // 🗺 Basemap: Schlicht ↔ Entdecken (OSM-POIs unter den eigenen Pins, ab Zoom ~15)
  document.getElementById('basembtn').onclick=()=>{
    const next = basemapPref()==='entdecken' ? 'schlicht' : 'entdecken';
    try{ localStorage.setItem('rm_basemap', next); }catch(e){}
    applyTheme();
    if (next==='entdecken') toast('Entdecken: fremde Läden erscheinen ab Zoom ~15 unter Deinen Pins');
  };
  applyTheme(true);
}

/* ====== Theme (Dark Mode + Entdecken-Basemap) ====== */
function basemapPref(){ try { return localStorage.getItem('rm_basemap') || 'schlicht'; } catch(e){ return 'schlicht'; } }
function applyTheme(initial){
  const dark=isDark(), discover=basemapPref()==='entdecken';
  document.body.classList.toggle('dark', dark);
  const btn=document.getElementById('themebtn');
  if (btn) btn.textContent=(dark?'🌙':'☀️')+' Darstellung: '+({auto:'Auto',hell:'Hell',dunkel:'Dunkel'}[themePref()]);
  const bb=document.getElementById('basembtn');
  if (bb) bb.textContent='🗺 Karte: '+(discover?'Entdecken (fremde Läden sichtbar)':'Schlicht');
  if (params.get('basemap')==='blank') return;
  // Entdecken nutzt Liberty (hell, mit OSM-POIs) — auch im Dark Mode, dort gibt es keinen POI-Stil
  const want=discover?DISCOVERMAP:(dark?DARKMAP:BASEMAP);
  if (map.__styleUrl!==want){
    map.__styleUrl=want;
    if (!initial){ map.setStyle(want); map.once('style.load', ()=>{ addMapContent(); applyFilter(); }); }
  }
}

/* ====== Statistik ====== */
function renderStats(){
  const P=allFeatures.map(f=>f.properties);
  const bes=P.filter(p=>p.status==='besucht'), wl=P.filter(p=>p.status!=='besucht');
  const cnt=(arr,fn)=>arr.filter(fn).length;
  const pct=(a,b)=>b?Math.round(100*a/b)+' %':'–';
  const goldB=cnt(bes,p=>p.rk==='gold'||p.rk==='lila'), goldW=cnt(wl,p=>p.rk==='gold'||p.rk==='lila');
  let h=`<h3>Überblick</h3><div class="kpis">
    <div class="kpi"><b>${P.length}</b><span>Orte gesamt</span></div>
    <div class="kpi"><b>${bes.length}</b><span>besucht</span></div>
    <div class="kpi"><b>${wl.length}</b><span>Watchlist</span></div>
    <div class="kpi"><b>${pct(goldB,bes.length)}</b><span>Gold/Lila besucht</span></div>
    <div class="kpi"><b>${pct(goldW,wl.length)}</b><span>Gold/Lila Watchlist</span></div>
    <div class="kpi"><b>${cnt(P,p=>p.rk==='rot')}</b><span>nie wieder</span></div></div>`;
  h+='<h3>Bewertungen</h3>';
  const rmax=Math.max(...RATE_ORDER.map(ck=>cnt(P,p=>p.rk===ck)),1);
  // Welle F: RATE_ORDER statt fester Liste (die alte Liste hatte blau vergessen); unbew gedimmt.
  for (const ck of RATE_ORDER){
    const n=cnt(P,p=>p.rk===ck);
    const dim = ck==='unbew' ? `;opacity:${UNBEW_ALPHA}` : '';
    h+=`<div class="brow"><span class="lbl">${RLABEL[ck]}</span>
        <span class="bar" style="width:${Math.round(58*n/rmax)}%;background:${COLORS[ck]}${dim}"></span>
        <span class="val">${n}</span></div>`;
  }
  h+='<h3>Typen</h3>';
  const tc={}; P.forEach(p=>tc[p.typ]=(tc[p.typ]||0)+1);
  const sorted=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const tmax=sorted.length?sorted[0][1]:1;
  for (const [t,n] of sorted){
    h+=`<div class="brow"><span class="lbl">${esc(t)}</span>
        <span class="bar" style="width:${Math.round(58*n/tmax)}%;background:var(--muted)"></span>
        <span class="val">${n}</span></div>`;
  }
  const ATAGS=['fruehstueck','brunch','lunch','kaffee','dinner','drinks','music'];
  const tagged=cnt(P,p=>{ const t=(p.tags||'').toLowerCase(); return ATAGS.some(tg=>t.includes(tg)); });
  const visited=cnt(P,p=>p.besucht_am);
  h+=`<p style="font-size:12px;color:var(--muted)">Besuchs-Log: ${visited} Einträge · Anlass-Tags: ${tagged} Orte · Stand: beim Öffnen berechnet</p>`;
  document.getElementById('statsbody').innerHTML=h;
}

/* ====== Ort hinzufügen (Edit-Modus) ====== */
const addSel = { typ:'', rate:'unbew', status:'wunschliste', quelle:'Spontanfund', place:null };  // Default: ohne Urteil (Grau-Split)
function initAdd(){
  if (!getToken()) return;
  const btn=document.getElementById('addbtn'); btn.style.display='block';
  const panel=document.getElementById('addpanel');
  btn.onclick=()=>panel.classList.add('open');
  panel.onclick=e=>{ if(e.target===panel) panel.classList.remove('open'); };
  const at=document.getElementById('atyps');
  TYPES.forEach(t=>{ const c=document.createElement('button'); c.className='a-chip'; c.textContent=TYP_SHORT[t]||t;
    c.dataset.typ=t;
    c.onclick=()=>{ at.querySelectorAll('.a-chip').forEach(x=>x.classList.remove('on'));
                    c.classList.add('on'); addSel.typ=t; };
    at.appendChild(c); });
  const ar=document.getElementById('arates');
  for (const ck of RATE_ORDER){
    const d=document.createElement('button'); d.className='a-dot'+(ck==='unbew'?' on':'');
    d.style.background=COLORS[ck]; d.title=RLABEL[ck];
    if (ck==='unbew') d.style.opacity=UNBEW_ALPHA;   // Grau-Split: gedimmter Dot
    d.onclick=()=>{ ar.querySelectorAll('.a-dot').forEach(x=>x.classList.remove('on'));
                    d.classList.add('on'); addSel.rate=ck; };
    ar.appendChild(d);
  }
  document.querySelectorAll('#astatus .a-chip').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#astatus .a-chip').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); addSel.status=b.dataset.s; });
  const aq=document.getElementById('aquelle'), aqf=document.getElementById('aquellefrei');
  aq.onchange=()=>{ if(aq.value==='__frei'){ aqf.style.display='block'; aqf.focus(); addSel.quelle=aqf.value.trim(); }
                    else { aqf.style.display='none'; addSel.quelle=aq.value; } };
  aqf.oninput=()=>{ addSel.quelle=aqf.value.trim()||'Spontanfund'; };
  document.getElementById('alookup').onclick=doLookup;
  document.getElementById('asave').onclick=doSave;
}
async function doLookup(){
  const v=document.getElementById('addq').value.trim(); if(!v) return;
  toast('Nachschlagen …', 9000);
  const j=await postJson(/^https?:\/\//.test(v) ? { action:'lookupPlace', url:v } : { action:'lookupPlace', query:v });
  if (!j) return;
  if (!j.place){ toast('Kein Treffer — anders formulieren?'); return; }
  addSel.place=j.place;
  const r=document.getElementById('aresult'); r.style.display='block';
  r.innerHTML=`<b>${esc(j.place.name)}</b><br>${esc(j.place.addr)}`+
    (j.place.status && j.place.status!=='OPERATIONAL' ? `<br><b style="color:#7B1420">${esc(j.place.status)}</b>` : '');
  document.getElementById('aform').style.display='block';
  if (j.place.typHint){ addSel.typ=TYP_ALIAS[j.place.typHint]||j.place.typHint;
    document.querySelectorAll('#atyps .a-chip').forEach(c=>c.classList.toggle('on', c.dataset.typ===addSel.typ)); }
  toast('Treffer gefunden — Typ/Bewertung wählen');
}
async function doSave(){
  const p=addSel.place; if (!p) return;
  if (!addSel.typ){ toast('Bitte Typ wählen'); return; }
  const [qv, pv]=RATE2QP[addSel.rate];
  const autoTags=(ANLASS_DEFAULT[addSel.typ]||[]).join(', '); // Anlass-Vorbelegung wie in der Migration
  toast('Speichern …', 9000);
  const quelle = (document.getElementById('aquelle').value==='__frei'
    ? (document.getElementById('aquellefrei').value.trim()||'Spontanfund')
    : document.getElementById('aquelle').value);
  const j=await postJson({ action:'addRow', row:{ name:p.name, lat:p.lat, lon:p.lng, typ:addSel.typ,
    status:addSel.status, qualitaet:qv, preis:pv, place_id:p.place_id, tags:autoTags, quelle:quelle,
    gmaps_url:'https://www.google.com/maps/place/?q=place_id:'+p.place_id } });
  if (!j) return;
  const f={ type:'Feature', geometry:{ type:'Point', coordinates:[p.lng,p.lat] },
    properties:{ id:j.id, name:p.name, typ:addSel.typ, status:addSel.status, q:qv, p:pv,
                 notiz:'', tags:autoTags, besucht_am:'' } };
  f.properties.rk=ratingKey(qv,pv); f.properties.prioInv=PRIO_MAX-PRIO[f.properties.rk];
  f.properties.icon=addSel.typ+'|'+f.properties.rk+'|'+(addSel.status==='wunschliste'?'w':'b');
  allFeatures.push(f); applyFilter();
  document.getElementById('addpanel').classList.remove('open');
  document.getElementById('addq').value=''; document.getElementById('aresult').style.display='none';
  document.getElementById('aform').style.display='none'; addSel.place=null;
  const _aq=document.getElementById('aquelle'); if(_aq) _aq.value='Spontanfund';
  const _aqf=document.getElementById('aquellefrei'); if(_aqf){ _aqf.style.display='none'; _aqf.value=''; }
  addSel.quelle='Spontanfund';
  map.flyTo({ center:[p.lng,p.lat], zoom:16 });
  toast(`${p.name} hinzugefügt ✓`);
}
</script>
